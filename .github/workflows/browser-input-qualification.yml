name: Independent native SDK browser readiness
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: native-sdk-browser-readiness-${{ github.sha }}
  cancel-in-progress: false
jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Qualify the existing exact native SDK without rebuild or publication
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 -B scripts/native-sdk-browser-runtime.py "$ARCHITECTURE" "$RUNNER_TEMP/native-sdk-browser-readiness"
      - name: Preserve complete readiness evidence including failed owners and retirement
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-sdk-browser-readiness-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-sdk-browser-readiness/evidence/
          if-no-files-found: error
          retention-days: 14
