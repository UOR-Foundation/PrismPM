# HELD isolated helper-branch replacement of the existing registered workflow.
# Diagnostic only: this does not construct or qualify an SDK.
name: CA mount lifecycle diagnostic
on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact immutable SDK source for the original tools factory
        required: true
        type: string
      diagnostic_sha256:
        description: Root-reviewed SHA256 of the diagnostic script
        required: true
        type: string
permissions:
  contents: read
jobs:
  ca-mount-layout:
    name: CA mount lifecycle (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
          - runner: ubuntu-24.04-arm
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Check out the exact diagnostic helper revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: diagnostic-helper
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the immutable qualification source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_revision }}
          path: root-a
          persist-credentials: false
          fetch-depth: 0
      - name: Run only the finite CA mount lifecycle diagnostic
        shell: bash
        env:
          EXPECTED_SOURCE: ${{ inputs.source_revision }}
          EXPECTED_DIAGNOSTIC_SHA256: ${{ inputs.diagnostic_sha256 }}
          ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE" = 4dcb7e325fff0e737ae4e02d2b36b3e86cd89176
          test "$EXPECTED_DIAGNOSTIC_SHA256" = 2f1d6ed3f55046bbb9406b7ca3eb15e27dcac66e6020ffb635fab0fcf23b46d4
          test "$(git -C diagnostic-helper rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git -C diagnostic-helper status --porcelain)"
          printf '%s  %s\n' "$EXPECTED_DIAGNOSTIC_SHA256" diagnostic-helper/scripts/diagnostics/hosted-ca-mount-diagnostic.py | sha256sum --check --strict
          python3 diagnostic-helper/scripts/diagnostics/hosted-ca-mount-diagnostic.py --execute \
            --source "$GITHUB_WORKSPACE/root-a" --architecture "$ARCHITECTURE" \
            --expected-script-sha256 "$EXPECTED_DIAGNOSTIC_SHA256" \
            --output "$RUNNER_TEMP/ca-mount-lifecycle-$ARCHITECTURE"
      - name: Retain bounded diagnostic records including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ca-mount-lifecycle-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ca-mount-lifecycle-${{ matrix.architecture }}
            !${{ runner.temp }}/ca-mount-lifecycle-${{ matrix.architecture }}/private/**
            !${{ runner.temp }}/ca-mount-lifecycle-${{ matrix.architecture }}/empty-docker-config/**
            !${{ runner.temp }}/ca-mount-lifecycle-${{ matrix.architecture }}/inner/private/**
            !${{ runner.temp }}/ca-mount-lifecycle-${{ matrix.architecture }}/inner/empty-docker-config/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
