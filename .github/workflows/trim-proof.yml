name: V&V trim test proof (scratch, not release evidence)
on:
  push:
    branches: [probe/trim-tests]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            status=0
            for name in browser-api-sdk-check ci-capacity ci-observe vv-assemble; do
              node --test --test-concurrency=1 --test-timeout=1500000 --test-reporter=tap "scripts/$name.test.mjs" > "/tmp/$name.tap" 2>&1 || status=1
              echo "== $name $(grep -E '^# (pass|fail) ' /tmp/$name.tap | tr '\n' ' ')"
              sed -n '/^not ok/,/^  \.\.\./p' "/tmp/$name.tap" | cut -c1-170 | head -60
            done
            exit "$status"
