name: Convert data-form test fixtures to notation (scratch, not for merge)

on:
  push:
    branches: [probe/convert-fixtures]

permissions:
  contents: read

jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Convert with lexlean::sdk::to_notation in the pinned devcontainer
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            cargo build --offline --locked --quiet -p repo-conformance --bin prismpm-semantic-source
            tool=target/debug/prismpm-semantic-source
            mkdir -p target/converted
            for f in tests/holo-primary-component/Fixture.lex.tex tests/publication-admission/src/Fixture.lex.tex; do
              mkdir -p "target/converted/$(dirname "$f")"
              # LexLean's own 1.1 -> 1.2 module migration (api/migrate.rs): the
              # module retagged lexlean/semantic-module/2, written, then printed
              # as notation, which must read back to exactly that module.
              "$tool" read < "$f" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const m=JSON.parse(s);if(m.spec!=="lexlean/semantic-module/1")throw Error("not a 1.1 module");m.spec="lexlean/semantic-module/2";process.stdout.write(JSON.stringify(m))})' > /tmp/module.json
              node -e 'const fs=require("fs");process.stdout.write(JSON.stringify({source:fs.readFileSync(process.argv[1],"utf8"),value:JSON.parse(fs.readFileSync("/tmp/module.json","utf8"))}))' "$f" | "$tool" write > /tmp/data.lex.tex
              "$tool" to-notation < /tmp/data.lex.tex > "target/converted/$f"
              cmp <(node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("fs").readFileSync("/tmp/module.json","utf8"))))') <("$tool" read < "target/converted/$f")
              ! grep -q '\\semanticdata' "target/converted/$f"
              echo "converted $f"
            done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: converted-fixtures
          path: target/converted/
          if-no-files-found: error
          retention-days: 7
