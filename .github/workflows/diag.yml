name: HO-15 and HO-19 diagnostics (scratch, not for merge)

on:
  push:
    branches: [probe/diag-*]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diag:
    name: ${{ matrix.which }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        which: [ho19]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        env:
          WHICH: ${{ matrix.which }}
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          env: WHICH
          runCmd: |
            set -uo pipefail
            mkdir -p target/ci-diagnostics
            if test "$WHICH" = ho15; then
              node --test --test-concurrency=1 --test-timeout=3500000 tests/holo-primary-component/owner.test.mjs > target/ci-diagnostics/out.log 2>&1
            else
              for attempt in 1 2 3; do
                node --test --test-concurrency=1 --test-timeout=240000 scripts/text-workbench.test.mjs > target/ci-diagnostics/out-$attempt.log 2>&1
                echo "attempt $attempt exit $?"
                grep -E '^not ok|^# (pass|fail) ' target/ci-diagnostics/out-$attempt.log
              done
            fi
            grep -hE 'HO15DIAG|^not ok|^# (tests|pass|fail) ' target/ci-diagnostics/*.log | cut -c1-500
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: diag-${{ matrix.which }}-${{ github.run_id }}
          path: target/ci-diagnostics/
