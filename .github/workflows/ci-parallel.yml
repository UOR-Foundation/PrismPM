name: Parallel CI Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-parallel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-policy:
    name: Lint & Dependency Policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Format, Clippy & Cargo Deny
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            cargo fmt --check
            cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
            cargo deny --frozen --all-features check

  model-and-audits:
    name: Model & Audits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check bootstrap source and validate
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            bash scripts/bootstrap-verify.sh --check-source
            cargo xtask validate

  unit-and-property-tests:
    name: Workspace Unit Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Workspace Unit & Property Tests
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            cargo test --workspace --bins --lib --all-features --locked --offline

  conformance:
    name: Conformance / ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        suite:
          - contracts
          - core
          - holo-stdlib
          - desktop-browser
          - system-oci
          - verification-schemas
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Run ${{ matrix.suite }} conformance suite
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            ./scripts/vv.sh conformance ${{ matrix.suite }}

  fixtures-and-golden:
    name: Fixtures & Reviewed Golden Outputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check Fixtures, Oracle & Golden Bytes
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            cargo xtask check-fixtures
            cargo run --locked --offline --manifest-path tests/holo-codec-oracle/Cargo.toml --target-dir target/holo-codec-oracle
            cargo xtask check-golden

  lean-and-formal-verification:
    name: Lean 4 Proofs & Formal Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify Examples & LexLean
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            cargo xtask verify-examples
            cargo run --locked --offline --target-dir target/vendor-lexlean --manifest-path vendor/lexlean/Cargo.toml -- --project lexlean.toml fmt --check
            cargo run --locked --offline --target-dir target/vendor-lexlean --manifest-path vendor/lexlean/Cargo.toml -- --project lexlean.toml lock --check

  packaging-and-upstream:
    name: Packaging, API & Upstream Conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Package API & Upstream Standards
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            ./scripts/vv.sh package-api
