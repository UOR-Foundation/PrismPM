            arch: amd64
            part: dk-3
          - os: ubuntu-24.04-arm
            arch: arm64
            part: dk-3
          - os: ubuntu-24.04
            arch: amd64
            part: ho-oc
          - os: ubuntu-24.04-arm
            arch: arm64
            part: ho-oc
          - os: ubuntu-24.04
            arch: amd64
            part: dk-2
          - os: ubuntu-24.04-arm
            arch: arm64
            part: dk-2
          - os: ubuntu-24.04
            arch: amd64
            part: gates
          - os: ubuntu-24.04-arm
            arch: arm64
            part: gates
          - os: ubuntu-24.04
            arch: amd64
            part: st-sy
          - os: ubuntu-24.04-arm
            arch: arm64
            part: st-sy
          - os: ubuntu-24.04
            arch: amd64
            part: dk-0-1
          - os: ubuntu-24.04-arm
            arch: arm64
            part: dk-0-1
          - os: ubuntu-24.04
            arch: amd64
            part: conformance
          - os: ubuntu-24.04-arm
            arch: arm64
            part: conformance
          - os: ubuntu-24.04
            arch: amd64
            part: source
          - os: ubuntu-24.04-arm
            arch: arm64
            part: source
    steps:
      # The isolated image closure needs four times the 5.9 GB of compressed SDK, daemon and
      # registry layers plus a 12 GiB reserve; the shorter list left 35 GB on amd64.
