            sdk-${{ matrix.arch }}-library-sdk.log
            root-a/target/library-sdk-evidence/
          if-no-files-found: error
          retention-days: 30
  # One installed pass per architecture, as the eight parts of
  # scripts/vv-assemble.mjs: 16 jobs, each under one 6 h hosted-job limit.
