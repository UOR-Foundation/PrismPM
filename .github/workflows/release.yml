            oras manifest fetch-config "$REPOSITORY@$digest" --output "$directory/config.json"
            node scripts/release-phases.mjs sbom-record "$directory" "$architecture" "$GITHUB_SHA" \
              "$REPOSITORY@$INDEX_DIGEST" "$GITHUB_REF"
            node scripts/release-phases.mjs sbom-publish "$directory" "$architecture" "$GITHUB_SHA" \
              "$REPOSITORY@$INDEX_DIGEST" "$GITHUB_REF" standards/trust/sigstore-trusted-root-cosign-3.1.3.json
            cmp "$directory/sbom.spdx.json" "$directory/sbom.received.spdx.json"
            for evidence in sbom-record.json sbom-manifest.json sbom-artifact.json sbom.sigstore.json sbom-signature-verification.json; do
              cp "$directory/$evidence" "$prefix.$evidence"
            done
            cp "$directory/manifest.json" "$prefix.image-manifest.json"
            cp "$directory/config.json" "$prefix.image-config.json"
          done
      - shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
          cosign sign --yes --oidc-provider github-actions \
            --trusted-root standards/trust/sigstore-trusted-root-cosign-3.1.3.json "$REPOSITORY@$DIGEST"
          node scripts/release-phases.mjs image-verify "$REPOSITORY@$DIGEST" "$GITHUB_SHA" "$GITHUB_REF" \
            standards/trust/sigstore-trusted-root-cosign-3.1.3.json >/dev/null
          docker pull "$REPOSITORY@$DIGEST"
          if [ "${{ matrix.name }}" = runtime ]; then
            test "$(docker run --rm --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" id -u)" != 0
            docker run --rm --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" node /opt/prismpm/runtime/runtime.mjs help
          else
            # The default initializer uses only its ordinary setuid/setgid
            # capability to adapt an optional Docker-socket group, then execs
            # the command as UID 1000. Explicit non-root invocations require
            # no capabilities at all, as used by the Action below.
            test "$(docker run --rm "$REPOSITORY@$DIGEST" id -u)" = 1000
            test "$(docker run --rm "$REPOSITORY@$DIGEST" sh -lc 'printf %s "$HOME"')" = /home/vscode
            docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" prismpm --version
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$REPOSITORY@$DIGEST" docker version --format '{{.Server.Version}}'
            case "${{ matrix.name }}" in
              adapter-compose) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/compose.json ;;
              adapter-kubernetes) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/kubernetes.json ;;
              adapter-github-pages) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/github-pages.json ;;
              oracles) docker run --rm "$REPOSITORY@$DIGEST" test -x /usr/local/bin/oci-distribution-conformance ;;
            esac
          fi
          printf '%s@%s\n' "$REPOSITORY" "$DIGEST" > "${{ matrix.name }}-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-image
          path: ${{ matrix.name }}-image.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-supply-chain
          path: |
            ${{ matrix.name }}-image-index.json
            ${{ matrix.name }}-linux-amd64.spdx.json
            ${{ matrix.name }}-linux-arm64.spdx.json
            ${{ matrix.name }}-linux-amd64.sbom.sigstore.json
            ${{ matrix.name }}-linux-arm64.sbom.sigstore.json
            ${{ matrix.name }}-linux-*.sbom-record.json
            ${{ matrix.name }}-linux-*.sbom-manifest.json
            ${{ matrix.name }}-linux-*.sbom-artifact.json
            ${{ matrix.name }}-linux-*.sbom-signature-verification.json
            ${{ matrix.name }}-linux-*.image-manifest.json
            ${{ matrix.name }}-linux-*.image-config.json
            ${{ matrix.name }}-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30

  images:
    needs: [sdk-supply, product-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - run: 'true'

  source-vv:
    name: source-vv-part-${{ matrix.part }}
    needs: [policy, sdk-supply]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - part: dk-3
          - part: ho-oc
          - part: dk-2
          - part: gates
          - part: st-sy
          - part: dk-0-1
          - part: conformance
          - part: source
    steps:
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: target/release-sdk
      - id: evidence
        run: |
          image=$(cat target/release-sdk/sdk-image.txt)
          name=$(node scripts/release-gate-evidence.mjs artifact-name "source-vv-part-${{ matrix.part }}" "$GITHUB_SHA" amd64 "$image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
      # Reuse the construction layers populated by PR Fast Checks. Each shard
      # still executes its complete source verification on this commit.
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          runCmd: |
            set -euo pipefail
            bash scripts/sdk-candidate.sh install-oras "$PWD/target/release-tools"
            bash scripts/sdk-candidate.sh install-cosign "$PWD/target/release-tools"
            export PATH="$PWD/target/release-tools:$PATH"
            image=$(cat target/release-sdk/sdk-image.txt)
            bash scripts/source-sdk-handoff.sh "$image" '${{ github.sha }}' amd64 '${{ github.ref }}' '${{ github.event_name }}' \
              bash scripts/vv.sh --with-sdk node scripts/release-gate-evidence.mjs source-run . target/source-vv-evidence \
              '${{ github.sha }}' amd64 "$image" '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ matrix.part }}'
      - name: Retain transport verification separately from source acceptance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-sdk-handoff-${{ matrix.part }}-${{ github.run_attempt }}
          path: target/source-sdk-handoff/
          if-no-files-found: warn
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: target/source-vv-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  gate:
    needs: [policy, sdk-supply, source-vv]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ needs.policy.outputs.version }}
      publish-crates: ${{ needs.policy.outputs.publish-crates }}
      rehearsal: ${{ needs.policy.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: target/release-sdk
      - id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-selection
          node scripts/release-artifact-metadata.mjs target/release-selection/selection-provider.json "$GITHUB_RUN_ID"
          image=$(cat target/release-sdk/sdk-image.txt)
          node scripts/release-gate-evidence.mjs select-artifacts target/release-selection/selection-provider.json target/release-selection/selection.json \
            "$GITHUB_SHA" amd64 "$image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" $(node scripts/vv-assemble.mjs --list | sed 's/[^[:space:]]\+/source-vv-part-&/g')
          ids=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).artifacts.map(a=>a.id).join(","))' target/release-selection/selection.json)
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.selection.outputs.ids }}
          merge-multiple: true
          path: target/source-vv-evidence
      - name: Require every source part on this commit
        run: |
          node scripts/release-gate-evidence.mjs source-assemble . target/source-vv-evidence "$GITHUB_SHA" amd64 "$(cat target/release-sdk/sdk-image.txt)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" -
      - id: evidence
        run: |
          name=$(node scripts/release-gate-evidence.mjs artifact-name source-vv "$GITHUB_SHA" amd64 "$(cat target/release-sdk/sdk-image.txt)" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: target/source-vv-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # Twelve bounded pairs; never share a cache or builder across the cold roots.
      - name: Retain original artifact metadata and immutable selections
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-selection-${{ github.job }}-${{ matrix.arch || 'all' }}-${{ github.run_attempt }}
          path: target/release-selection/*.json
          if-no-files-found: error
          retention-days: 30

  reproducibility-parts:
    needs: [policy, images]
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: runtime
            name: sdk-amd64
            image: sdk
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: runtime
            name: sdk-arm64
            image: sdk
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            name: runtime-amd64
            image: runtime
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            name: runtime-arm64
            image: runtime
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            name: adapter-compose-amd64
            image: adapter-compose
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            name: adapter-compose-arm64
            image: adapter-compose
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            name: adapter-kubernetes-amd64
            image: adapter-kubernetes
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            name: adapter-kubernetes-arm64
            image: adapter-kubernetes
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            name: adapter-github-pages-amd64
            image: adapter-github-pages
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            name: adapter-github-pages-arm64
            image: adapter-github-pages
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: oracles
            name: oracles-amd64
            image: oracles
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: oracles
            name: oracles-arm64
            image: oracles
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      # Two independent OCI exports must fit alongside the BuildKit cache.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /usr/local/julia* /opt/az /opt/microsoft \
            /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-a
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-b
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.image }}-image
          path: .shipped-image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Record allocated storage before the independent roots
        run: bash root-a/scripts/release-storage-snapshot.sh before-roots "$RUNNER_TEMP/repro-before.txt" root-a root-b
      - shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.policy.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          identity_file=".shipped-image/$IMAGE-image.txt"
          identity=$(cat "$identity_file")
          docker buildx imagetools inspect --raw "$identity" > shipped-index.json
          for root in root-a root-b; do
            builder="repro-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.name }}-$root"
            if docker buildx inspect "$builder" >/dev/null 2>&1; then exit 1; fi
            docker buildx create --name "$builder" --driver docker-container \
              --driver-opt image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
            trap 'docker buildx rm "$builder"' EXIT
            context=()
            if [ "$DOCKERFILE" = sdk/Dockerfile ]; then
              build=(node "$root/scripts/sdk-image-inputs.mjs" build "$root" "$GITHUB_SHA" "$TARGET")
            else
              test "$DOCKERFILE" = sdk/runtime/Dockerfile
              build=(docker buildx build --file "$root/$DOCKERFILE")
              context=("$root")
            fi
            "${build[@]}" --builder "$builder" --no-cache --provenance=false --sbom=false \
              --build-arg SOURCE_DATE_EPOCH=0 \
              --label "org.opencontainers.image.created=1970-01-01T00:00:00Z" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" \
              --platform "$PLATFORM" \
              --output "type=oci,tar=false,dest=$root.oci,rewrite-timestamp=true,oci-mediatypes=true" "${context[@]}"
            docker buildx rm "$builder"
            trap - EXIT
            volumes=$(docker volume ls --format '{{.Name}}')
            if printf '%s\n' "$volumes" | grep -Fxq "buildx_buildkit_${builder}0_state"; then exit 1; fi
            bash root-a/scripts/release-storage-snapshot.sh "$root-retired" "$RUNNER_TEMP/repro-$root-retired.txt" "$root.oci"
            jq -r '.manifests[0].digest' "$root.oci/index.json" > "$root.digest"
          done
          cmp root-a.digest root-b.digest
          cmp root-a.oci/index.json root-b.oci/index.json
          node root-a/scripts/release-phases.mjs reproducibility \
            "$identity_file" shipped-index.json "${PLATFORM#linux/}" "$GITHUB_SHA" \
            root-a.oci root-b.oci > "${{ matrix.name }}-reproducibility.txt"
      - name: Record complete raw-pair allocated storage after final custody
        run: bash root-a/scripts/release-storage-snapshot.sh after-custody "$RUNNER_TEMP/repro-after.txt" root-a.oci root-b.oci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reproduction-storage-${{ matrix.name }}
          path: ${{ runner.temp }}/repro-*.txt
          if-no-files-found: error
          retention-days: 30
      - name: Diagnose differing OCI layers without changing acceptance
        if: failure()
        timeout-minutes: 5
        run: |
          if [ -f root-a.oci/index.json ] && [ -f root-b.oci/index.json ]; then
            python3 -I -B root-a/scripts/oci-repro-diagnostics.py root-a.oci root-b.oci > reproducibility-diagnostics.json 2> reproducibility-diagnostics.log
          fi
      - name: Retain bounded reproducibility diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-diagnostics-${{ matrix.name }}
          path: reproducibility-diagnostics.*
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-${{ matrix.name }}
          path: ${{ matrix.name }}-reproducibility.txt
          if-no-files-found: error
          retention-days: 30
  browser-library:
    needs: [policy, sdk-supply]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
