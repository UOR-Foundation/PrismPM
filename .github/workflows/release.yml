      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-sdk-sdk-${{ matrix.arch }}
          path: sdk-${{ matrix.arch }}-browser-sdk.log
