          if-no-files-found: error
          retention-days: 30

  installed-sdk:
    needs: [policy, sdk-supply, installed-vv, product-cli]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-a
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: .shipped-image
      - id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-selection
          node root-a/scripts/release-artifact-metadata.mjs target/release-selection/selection-provider.json "$GITHUB_RUN_ID"
          image=$(cat .shipped-image/sdk-image.txt)
          node root-a/scripts/release-gate-evidence.mjs select-artifacts target/release-selection/selection-provider.json target/release-selection/selection.json \
            "$GITHUB_SHA" '${{ matrix.arch }}' "$image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" $(node root-a/scripts/vv-assemble.mjs --list | sed "s/[^[:space:]]\+/full-sdk-vv-sdk-${{ matrix.arch }}-&/g")
          ids=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).artifacts.map(a=>a.id).join(","))' target/release-selection/selection.json)
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.selection.outputs.ids }}
          merge-multiple: true
          path: .installed-vv
      - name: Require every installed part on this commit and image
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          node root-a/scripts/sdk-release-evidence.mjs assemble-installed .installed-vv \
            "sdk-$ARCH-vv-evidence.json" "$(cat .shipped-image/sdk-image.txt)" "$GITHUB_SHA" "$ARCH"
