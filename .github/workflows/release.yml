name: PrismPM OCI/native and Cargo publication

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer without a leading v
        required: true
        default: 0.4.0
        type: string
      publish-crates:
        description: Publish the already packaged crates through crates.io trusted publishing
        required: true
        default: false
        type: boolean
      rehearsal:
        description: Run every check but publish no release assets, discovery tags or crates. Images are still pushed by digest and signed.
        required: true
        default: true
        type: boolean
  push:
    # Every release-branch update qualifies its exact merge commit. Branch
    # pushes are always rehearsals; only the release tag can publish by push.
    branches:
      - release/v0.4
    tags:
      - v0.4.0

# Never cancel a release in flight: partial publication is worse than queueing.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

permissions: {}

env:
  SDK_REPOSITORY: ghcr.io/uor-foundation/prismpm-sdk
  RUNTIME_REPOSITORY: ghcr.io/uor-foundation/prismpm-runtime

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish-crates: ${{ steps.version.outputs.publish-crates }}
      rehearsal: ${{ steps.version.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Check native release contracts before building
        run: node --test scripts/release-native-contract.test.mjs
      - id: version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: |
          set -euo pipefail
          node scripts/release-phases.mjs policy >> "$GITHUB_OUTPUT"
          test "$(git status --porcelain)" = ""
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)" = 0.4.0

  # The factory route (factory/src/Factory/Release.lex.tex, scripts/factory.mjs).
  # Source V&V is established once per κ: the source tree without the release
  # plumbing. When an ancestor on the release line with the same κ passed the
  # gate, its retained source evidence is the receipt and source-vv is not run
  # again. The plumbing's own tests run fresh in devcontainer-image every time.
  factory:
    needs: policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      kappa: ${{ steps.route.outputs.kappa }}
      route: ${{ steps.route.outputs.route }}
      source-revision: ${{ steps.route.outputs.source-revision }}
      run-id: ${{ steps.route.outputs.run-id }}
      run-attempt: ${{ steps.route.outputs.run-attempt }}
      build-route: ${{ steps.route.outputs.build-route }}
      build-identity: ${{ steps.route.outputs.build-identity }}
      build-revision: ${{ steps.route.outputs.build-revision }}
      build-run-id: ${{ steps.route.outputs.build-run-id }}
      build-run-attempt: ${{ steps.route.outputs.build-run-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/factory.mjs find-receipt "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  # One source pass, as the eight `just vv-part` parts of scripts/vv-assemble.mjs,
  # each under one 6 h hosted-job limit. Longest parts first so max-parallel
  # starts them before the short ones; tests derive the set from `parts`.
  # GitHub keeps PR caches on the PR ref, so a release-branch or tag run never
  # sees the layers PR Fast Checks wrote. Build the pinned devcontainer once on
  # this ref first; the source shards then import its layers instead of each
  # repeating every package, toolchain and snapshot.debian.org download.
  devcontainer-image:
    name: Devcontainer image cache and plumbing checks
    needs: [policy, factory]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - uses: ./.github/actions/prepare-devcontainer-runner
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      # The SBOM transport tests drive the exact pinned ORAS and cosign the SDK
      # image carries; the devcontainer has neither. Checksummed downloads,
      # retried because GitHub release assets intermittently return 5xx.
      - name: Install the pinned transport and verifier tools
        run: |
          set -euo pipefail
          tools="$GITHUB_WORKSPACE/target/release-tools"
          for tool in oras cosign; do
            for attempt in 1 2 3 4; do
              bash scripts/sdk-candidate.sh "install-$tool" "$tools" && break
              test "$attempt" -lt 4
              sleep $((attempt * 15))
            done
          done
          "$tools/oras" version
          "$tools/cosign" version
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          cacheTo: ${{ steps.cache.outputs.cache-to }}
          # κ leaves the plumbing out, so its own tests and the factory model
          # are checked on every run, whichever route source V&V takes.
          runCmd: |
            set -euo pipefail
            cargo fetch --locked
            PATH="$PWD/target/release-tools:$PATH" node scripts/factory.mjs checks
            cargo run --locked --quiet --release --manifest-path vendor/lexlean/Cargo.toml --bin lexlean -- --project factory/lexlean.toml verify

  source-vv:
    needs: [policy, factory, devcontainer-image]
    if: ${{ needs.factory.outputs.route == 'establish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - part: dk-3
          - part: ho-oc
          - part: dk-2
          - part: gates
          - part: st-sy
          - part: dk-0-1
          - part: conformance
          - part: source
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
      # The shared cleanup also removes unused host toolchains the shorter list
      # kept; ho-oc's OC-10 capture needs its fixed 10 GiB volume headroom.
      - uses: ./.github/actions/prepare-devcontainer-runner
      # Reuse the construction layers devcontainer-image wrote for this ref.
      # Each shard still executes its complete source verification on this commit.
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          runCmd: |
            set -euo pipefail
            bash scripts/vv.sh --with-sdk bash -euo pipefail -c "$(cat <<'PRISMPM_VV'
            node scripts/release-gate-evidence.mjs source-run . target/source-vv-evidence '${{ github.sha }}' amd64 - '${{ github.run_id }}' '${{ github.run_attempt }}' '${{ matrix.part }}'
            PRISMPM_VV
            )"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-vv-part-${{ matrix.part }}
          path: target/source-vv-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  # The gate accepts source V&V either established by source-vv on this commit
  # or proved by the factory receipt, and records which in factory-route.json.
  gate:
    needs: [policy, factory, devcontainer-image, source-vv]
    if: >-
      ${{ !cancelled() && needs.policy.result == 'success' && needs.factory.result == 'success'
      && needs.devcontainer-image.result == 'success'
      && ((needs.factory.outputs.route == 'establish' && needs.source-vv.result == 'success')
      || (needs.factory.outputs.route == 'proved' && needs.source-vv.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ needs.policy.outputs.version }}
      publish-crates: ${{ needs.policy.outputs.publish-crates }}
      rehearsal: ${{ needs.policy.outputs.rehearsal }}
      source-revision: ${{ steps.source.outputs.revision }}
      source-run-id: ${{ steps.source.outputs.run-id }}
      source-run-attempt: ${{ steps.source.outputs.run-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ needs.factory.outputs.route == 'establish' }}
        with:
          pattern: source-vv-part-*
          merge-multiple: true
          path: target/source-vv-evidence
      - name: Require every source part on this commit
        if: ${{ needs.factory.outputs.route == 'establish' }}
        run: |
          node scripts/release-gate-evidence.mjs source-assemble . target/source-vv-evidence "$GITHUB_SHA" amd64 - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" -
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ needs.factory.outputs.route == 'proved' }}
        with:
          name: source-vv
          path: target/source-vv-evidence
          run-id: ${{ needs.factory.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Require the receipt's every source part on its own commit and run
        if: ${{ needs.factory.outputs.route == 'proved' }}
        env:
          SOURCE_REVISION: ${{ needs.factory.outputs.source-revision }}
          SOURCE_RUN_ID: ${{ needs.factory.outputs.run-id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.factory.outputs.run-attempt }}
        run: |
          node scripts/release-gate-evidence.mjs source-receipt . target/source-vv-evidence "$SOURCE_REVISION" amd64 - "$SOURCE_RUN_ID" "$SOURCE_RUN_ATTEMPT" -
      - id: source
        env:
          ROUTE: ${{ needs.factory.outputs.route }}
          SOURCE_REVISION: ${{ needs.factory.outputs.source-revision }}
          SOURCE_RUN_ID: ${{ needs.factory.outputs.run-id }}
          SOURCE_RUN_ATTEMPT: ${{ needs.factory.outputs.run-attempt }}
          BUILD_ROUTE: ${{ needs.factory.outputs.build-route }}
          BUILD_REVISION: ${{ needs.factory.outputs.build-revision }}
          BUILD_RUN_ID: ${{ needs.factory.outputs.build-run-id }}
          BUILD_RUN_ATTEMPT: ${{ needs.factory.outputs.build-run-attempt }}
        run: |
          set -euo pipefail
          if [ "$BUILD_ROUTE" = establish ]; then
            build="established $GITHUB_SHA $GITHUB_RUN_ID $GITHUB_RUN_ATTEMPT"
          else
            test "$BUILD_ROUTE" = proved
            build="proved $BUILD_REVISION $BUILD_RUN_ID $BUILD_RUN_ATTEMPT"
          fi
          if [ "$ROUTE" = establish ]; then
            route=established revision=$GITHUB_SHA run_id=$GITHUB_RUN_ID run_attempt=$GITHUB_RUN_ATTEMPT
          else
            test "$ROUTE" = proved
            route=proved revision=$SOURCE_REVISION run_id=$SOURCE_RUN_ID run_attempt=$SOURCE_RUN_ATTEMPT
          fi
          mkdir factory-route
          # shellcheck disable=SC2086 # $build is four words, each validated by factory.mjs.
          node scripts/factory.mjs route factory-route/factory-route.json "$GITHUB_SHA" "$route" "$revision" "$run_id" "$run_attempt" $build
          printf 'revision=%s\nrun-id=%s\nrun-attempt=%s\n' "$revision" "$run_id" "$run_attempt" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-vv
          path: target/source-vv-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-route
          path: factory-route/factory-route.json
          if-no-files-found: error
          retention-days: 30

  # Each platform is built on its own native runner: emulated arm64 builds
  # exceed the hosted job limit. One job per platform builds every image in
  # one Buildx builder, so the targets of sdk/Dockerfile share their stages.
  # Image stages establish projection obligations only, so they start beside
  # source V&V; only publication waits for the gate (Factory.Release).
  image-platforms:
    needs: [policy, factory]
    if: ${{ needs.factory.outputs.build-route == 'establish' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Require the source-bound publication policy before registry credentials
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: node scripts/release-phases.mjs policy
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.policy.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/image-platforms"
          while read -r name dockerfile target repository; do
            if [ "$dockerfile" = sdk/Dockerfile ]; then
              build=(node scripts/sdk-image-inputs.mjs build . "$GITHUB_SHA" "$target")
              context=()
            else
              test "$dockerfile" = sdk/runtime/Dockerfile
              test "$target" = -
              build=(docker buildx build --file "$dockerfile")
              context=(.)
            fi
            "${build[@]}" --platform "linux/$ARCH" \
              --output "type=registry,name=$repository,push-by-digest=true,name-canonical=true,rewrite-timestamp=true,oci-mediatypes=true" \
              --metadata-file "$RUNNER_TEMP/$name-build.json" \
              --provenance=false --sbom=false --build-arg SOURCE_DATE_EPOCH=0 \
              --label org.opencontainers.image.created=1970-01-01T00:00:00Z \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.version=$VERSION" "${context[@]}"
            node scripts/sdk-image-inputs.mjs digest "$RUNNER_TEMP/$name-build.json" > "$RUNNER_TEMP/image-platforms/$name-$ARCH.digest"
          done <<'IMAGES'
          sdk sdk/Dockerfile runtime ghcr.io/uor-foundation/prismpm-sdk
          runtime sdk/runtime/Dockerfile - ghcr.io/uor-foundation/prismpm-runtime
          adapter-compose sdk/Dockerfile adapter-compose ghcr.io/uor-foundation/prismpm-adapter-compose
          adapter-kubernetes sdk/Dockerfile adapter-kubernetes ghcr.io/uor-foundation/prismpm-adapter-kubernetes
          adapter-github-pages sdk/Dockerfile adapter-github-pages ghcr.io/uor-foundation/prismpm-adapter-github-pages
          oracles sdk/Dockerfile oracles ghcr.io/uor-foundation/prismpm-oracles
          IMAGES
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: image-platforms-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-platforms/
          if-no-files-found: error
          retention-days: 30

  images:
    needs: [policy, factory, image-platforms]
    if: ${{ needs.factory.outputs.build-route == 'establish' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - name: sdk
            dockerfile: sdk/Dockerfile
            target: runtime
            repository: ghcr.io/uor-foundation/prismpm-sdk
          - name: runtime
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            repository: ghcr.io/uor-foundation/prismpm-runtime
          - name: adapter-compose
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            repository: ghcr.io/uor-foundation/prismpm-adapter-compose
          - name: adapter-kubernetes
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            repository: ghcr.io/uor-foundation/prismpm-adapter-kubernetes
          - name: adapter-github-pages
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            repository: ghcr.io/uor-foundation/prismpm-adapter-github-pages
          - name: oracles
            dockerfile: sdk/Dockerfile
            target: oracles
            repository: ghcr.io/uor-foundation/prismpm-oracles
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - name: Require the source-bound publication policy before registry credentials
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: node scripts/release-phases.mjs policy
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Install exact OCI transport and signature verifier tools
        run: |
          set -euo pipefail
          bash scripts/sdk-candidate.sh install-oras "$RUNNER_TEMP/release-tools"
          bash scripts/sdk-candidate.sh install-cosign "$RUNNER_TEMP/release-tools"
          echo "$RUNNER_TEMP/release-tools" >> "$GITHUB_PATH"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: image-platforms-*
          merge-multiple: true
          path: image-platforms
      # The index names exactly the two platform manifests built natively
      # above, and is pushed by digest: no tag moves.
      - id: build
        env:
          IMAGE: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          platforms=()
          for architecture in amd64 arm64; do
            digest=$(cat "image-platforms/$IMAGE-$architecture.digest")
            case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
            oras manifest fetch "$REPOSITORY@$digest" --output "$RUNNER_TEMP/$architecture.manifest.json"
            platforms+=("$digest" "$RUNNER_TEMP/$architecture.manifest.json")
          done
          digest=$(node scripts/release-phases.mjs image-index "${platforms[@]}" "$RUNNER_TEMP/image-index.json")
          oras manifest push --media-type application/vnd.oci.image.index.v1+json \
            "$REPOSITORY@$digest" "$RUNNER_TEMP/image-index.json"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - id: platforms
        shell: bash
        env:
          IMAGE_INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect --raw "$REPOSITORY@$IMAGE_INDEX_DIGEST" > "${{ matrix.name }}-image-index.json"
          for architecture in amd64 arm64; do
            child_digest=$(jq -er --arg architecture "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest' \
              "${{ matrix.name }}-image-index.json")
            case "$child_digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
            printf '%s=%s\n' "$architecture" "$child_digest" >> "$GITHUB_OUTPUT"
          done
      - id: sbom-amd64
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ matrix.repository }}@${{ steps.platforms.outputs.amd64 }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ matrix.name }}-linux-amd64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: sbom-arm64
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ${{ matrix.repository }}@${{ steps.platforms.outputs.arm64 }}
          syft-version: v1.51.1
          format: spdx-json
          output-file: ${{ matrix.name }}-linux-arm64.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - id: attest-provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ matrix.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Stage the image-index provenance bundle
        shell: bash
        env:
          PROVENANCE: ${{ steps.attest-provenance.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE" "${{ matrix.name }}-provenance.sigstore.json"
      # Large SPDX remains a complete blob, with its small OCI 1.1 manifest
      # keylessly signed. This is not an inline SPDX attestation.
      - name: Publish and verify both complete platform SBOM artifacts
        env:
          IMAGE: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          AMD64_DIGEST: ${{ steps.platforms.outputs.amd64 }}
          ARM64_DIGEST: ${{ steps.platforms.outputs.arm64 }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: |
          set -euo pipefail
          for architecture in amd64 arm64; do
            if test "$architecture" = amd64; then digest=$AMD64_DIGEST; else digest=$ARM64_DIGEST; fi
            directory="$RUNNER_TEMP/release-sbom-$IMAGE-$architecture"
            prefix="$IMAGE-linux-$architecture"
            mkdir "$directory"
            cp "$IMAGE-image-index.json" "$directory/index.json"
            cp "$prefix.spdx.json" "$directory/sbom.spdx.json"
            oras manifest fetch "$REPOSITORY@$digest" --output "$directory/manifest.json"
            oras manifest fetch-config "$REPOSITORY@$digest" --output "$directory/config.json"
            node scripts/release-phases.mjs sbom-record "$directory" "$architecture" "$GITHUB_SHA" \
              "$REPOSITORY@$INDEX_DIGEST" "$GITHUB_REF"
            node scripts/release-phases.mjs sbom-publish "$directory" "$architecture" "$GITHUB_SHA" \
              "$REPOSITORY@$INDEX_DIGEST" "$GITHUB_REF" standards/trust/sigstore-trusted-root-cosign-3.1.3.json
            cmp "$directory/sbom.spdx.json" "$directory/sbom.received.spdx.json"
            for evidence in sbom-record.json sbom-manifest.json sbom-artifact.json sbom.sigstore.json sbom-signature-verification.json; do
              cp "$directory/$evidence" "$prefix.$evidence"
            done
            cp "$directory/manifest.json" "$prefix.image-manifest.json"
            cp "$directory/config.json" "$prefix.image-config.json"
          done
      - shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          case "$DIGEST" in sha256:????????????????????????????????????????????????????????????????) ;; *) exit 2 ;; esac
          cosign sign --yes --oidc-provider github-actions \
            --trusted-root standards/trust/sigstore-trusted-root-cosign-3.1.3.json "$REPOSITORY@$DIGEST"
          node scripts/release-phases.mjs image-verify "$REPOSITORY@$DIGEST" "$GITHUB_SHA" "$GITHUB_REF" \
            standards/trust/sigstore-trusted-root-cosign-3.1.3.json >/dev/null
          docker pull "$REPOSITORY@$DIGEST"
          if [ "${{ matrix.name }}" = runtime ]; then
            test "$(docker run --rm --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" id -u)" != 0
            docker run --rm --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" node /opt/prismpm/runtime/runtime.mjs help
          else
            # The default initializer uses only its ordinary setuid/setgid
            # capability to adapt an optional Docker-socket group, then execs
            # the command as UID 1000. Explicit non-root invocations require
            # no capabilities at all, as used by the Action below.
            test "$(docker run --rm "$REPOSITORY@$DIGEST" id -u)" = 1000
            test "$(docker run --rm "$REPOSITORY@$DIGEST" sh -lc 'printf %s "$HOME"')" = /home/vscode
            docker run --rm --user 1000:1000 --cap-drop ALL --security-opt no-new-privileges "$REPOSITORY@$DIGEST" prismpm --version
            docker run --rm --volume /var/run/docker.sock:/var/run/docker.sock "$REPOSITORY@$DIGEST" docker version --format '{{.Server.Version}}'
            case "${{ matrix.name }}" in
              adapter-compose) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/compose.json ;;
              adapter-kubernetes) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/kubernetes.json ;;
              adapter-github-pages) docker run --rm "$REPOSITORY@$DIGEST" test -r /opt/prismpm/share/adapters/github-pages.json ;;
              oracles) docker run --rm "$REPOSITORY@$DIGEST" test -x /usr/local/bin/oci-distribution-conformance ;;
            esac
          fi
          printf '%s@%s\n' "$REPOSITORY" "$DIGEST" > "${{ matrix.name }}-image.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-image
          path: ${{ matrix.name }}-image.txt
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}-supply-chain
          path: |
            ${{ matrix.name }}-image-index.json
            ${{ matrix.name }}-linux-amd64.spdx.json
            ${{ matrix.name }}-linux-arm64.spdx.json
            ${{ matrix.name }}-linux-amd64.sbom.sigstore.json
            ${{ matrix.name }}-linux-arm64.sbom.sigstore.json
            ${{ matrix.name }}-linux-*.sbom-record.json
            ${{ matrix.name }}-linux-*.sbom-manifest.json
            ${{ matrix.name }}-linux-*.sbom-artifact.json
            ${{ matrix.name }}-linux-*.sbom-signature-verification.json
            ${{ matrix.name }}-linux-*.image-manifest.json
            ${{ matrix.name }}-linux-*.image-config.json
            ${{ matrix.name }}-provenance.sigstore.json
          if-no-files-found: error
          retention-days: 30

  reproducibility:
    needs: [policy, factory, images]
    if: ${{ needs.factory.outputs.build-route == 'establish' }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: runtime
            name: sdk-amd64
            image: sdk
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: runtime
            name: sdk-arm64
            image: sdk
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            name: runtime-amd64
            image: runtime
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/runtime/Dockerfile
            target: ""
            name: runtime-arm64
            image: runtime
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            name: adapter-compose-amd64
            image: adapter-compose
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-compose
            name: adapter-compose-arm64
            image: adapter-compose
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            name: adapter-kubernetes-amd64
            image: adapter-kubernetes
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-kubernetes
            name: adapter-kubernetes-arm64
            image: adapter-kubernetes
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            name: adapter-github-pages-amd64
            image: adapter-github-pages
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: adapter-github-pages
            name: adapter-github-pages-arm64
            image: adapter-github-pages
          - os: ubuntu-24.04
            platform: linux/amd64
            dockerfile: sdk/Dockerfile
            target: oracles
            name: oracles-amd64
            image: oracles
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            dockerfile: sdk/Dockerfile
            target: oracles
            name: oracles-arm64
            image: oracles
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      # Two OCI exports (one on a failed comparison) must fit alongside the BuildKit cache.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /usr/local/julia* /opt/az /opt/microsoft \
            /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-a
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-b
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ matrix.image }}-image
          path: .shipped-image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - shell: bash
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.policy.outputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          identity_file=".shipped-image/$IMAGE-image.txt"
          identity=$(cat "$identity_file")
          docker buildx imagetools inspect --raw "$identity" > shipped-index.json
          # The shipped build is one root; one independent no-cache rebuild in a
          # second root on another runner establishes reproducibility. A third
          # build would establish it again (Factory.Release, eachOnce).
          bash root-a/scripts/release-rebuild.sh root-b
          node root-a/scripts/release-phases.mjs reproducibility \
            "$identity_file" shipped-index.json "${PLATFORM#linux/}" "$GITHUB_SHA" \
            root-b.oci > "${{ matrix.name }}-reproducibility.txt"
      # A failed comparison is diagnosed against the shipped bytes themselves:
      # the shipped platform manifest is copied by digest (no further build)
      # and compared layer by layer with the rebuild. It never changes acceptance.
      - name: Diagnose differing OCI layers without changing acceptance
        if: failure()
        timeout-minutes: 60
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          test -f root-b.oci/index.json
          tools="$RUNNER_TEMP/release-tools"
          bash root-a/scripts/sdk-candidate.sh install-oras "$tools"
          identity=$(cat ".shipped-image/$IMAGE-image.txt")
          platform=$(jq -er --arg arch "${PLATFORM#linux/}" \
            '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else error("one shipped platform manifest") end' \
            shipped-index.json)
          "$tools/oras" copy --to-oci-layout "${identity%@*}@$platform" shipped.oci:shipped
          python3 -I -B root-a/scripts/oci-repro-diagnostics.py shipped.oci root-b.oci > reproducibility-diagnostics.json 2> reproducibility-diagnostics.log
      - name: Retain bounded reproducibility diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-diagnostics-${{ matrix.name }}
          path: reproducibility-diagnostics.*
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducibility-${{ matrix.name }}
          path: ${{ matrix.name }}-reproducibility.txt
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact current SDK browser closure offline and read-only
        if: matrix.image == 'sdk'
        shell: bash
        env:
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bash root-a/scripts/browser-api-sdk-check.sh "$(cat .shipped-image/sdk-image.txt)" "$GITHUB_SHA" > "$RESULT_NAME-browser-sdk.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.image == 'sdk'
        with:
          name: browser-sdk-${{ matrix.name }}
          path: ${{ matrix.name }}-browser-sdk.log
          if-no-files-found: error
          retention-days: 30
      - name: Verify exact current SDK native-library closure offline and read-only
        if: matrix.image == 'sdk'
        shell: bash
        env:
          RESULT_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          bash root-a/scripts/library-sdk-check.sh "$(cat .shipped-image/sdk-image.txt)" "$GITHUB_SHA" > "$RESULT_NAME-library-sdk.log" 2>&1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && matrix.image == 'sdk'
        with:
          name: library-sdk-${{ matrix.name }}
          path: |
            ${{ matrix.name }}-library-sdk.log
            root-a/target/library-sdk-evidence/
          if-no-files-found: error
          retention-days: 30
  # Installed V&V re-ran the eight source parts inside the shipped image: the
  # source obligation a second time, on a projection (Factory.Release,
  # thePriorRouteVerifiedTheSourceTwice). The image is bound to the source by
  # reproducibility, native equivalence and the installed product build below.
  installed-sdk:
    needs: [policy, factory, images]
    if: ${{ needs.factory.outputs.build-route == 'establish' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: root-a
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
