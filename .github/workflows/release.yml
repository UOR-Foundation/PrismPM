          parts=$(node scripts/vv-assemble.mjs --list)
          for architecture in amd64 arm64; do
            node scripts/library-sdk-metadata-evidence.mjs pack \
              ".sdk-gate-evidence/library-sdk-sdk-$architecture/root-a/target/library-sdk-evidence/linux-$architecture" \
              "release/sdk-$architecture-native-metadata.tar" . "$image" "$GITHUB_SHA" "$architecture"
            for part in $parts; do
              node scripts/sdk-release-evidence.mjs full-sdk-vv \
                ".sdk-gate-evidence/full-sdk-vv/sdk-$architecture-full-sdk-vv-$part" "release/sdk-$architecture-full-sdk-vv-$part.tar" \
                "$image" "$GITHUB_SHA" "$architecture" "$part"
            done
            node scripts/sdk-release-evidence.mjs product-cli \
              ".sdk-gate-evidence/product-cli-sdk-$architecture" "release/sdk-$architecture-product-cli.tar" \
              "$image" "$GITHUB_SHA" "$architecture"
            node scripts/sdk-release-evidence.mjs native-equivalence \
              ".sdk-gate-evidence/native-equivalence-sdk-$architecture" "release/sdk-$architecture-native-equivalence.tar" \
              "$image" "$GITHUB_SHA" "$architecture" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          done
      - shell: bash
        run: |
          set -euo pipefail
          cd release
          checksums=$(mktemp)
          trap 'rm -f "$checksums"' EXIT
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > "$checksums"
          mv "$checksums" SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        if: ${{ needs.gate.outputs.rehearsal != 'true' }}
        with:
          subject-path: release/prismpm-*.tar.gz
      - name: Publish only exact unaccepted verification assets; never overwrite
        if: ${{ needs.gate.outputs.rehearsal != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NEEDS: ${{ toJSON(needs) }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: node scripts/release-phases.mjs publish-oci release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: oci-native-publication
          path: release/*
          if-no-files-found: error
          retention-days: 30

  # Packaging, identity and dry-run always run here; the upload runs only with a
  # credential. A `CARGO_REGISTRY_TOKEN` secret in the crates.io environment is
  # the credential for the owner's first uploads (a crate must exist before
  # trusted publishing can be configured for it, #19). The repository variable
  # CRATES_IO_TRUSTED_PUBLISHING=true selects trusted publishing once the owner
  # has configured it. With neither, every crate is packaged, compared with the
  # reviewed archive, checked for crates.io metadata and dry-run, and nothing is
  # uploaded. docs/release/crates-io-publication.md states the order and the
  # pre-release version scheme (#214).
      - name: Retain original artifact metadata and immutable selections
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-selection-${{ github.job }}-${{ matrix.arch || 'all' }}-${{ github.run_attempt }}
          path: target/release-selection/*.json
          if-no-files-found: error
          retention-days: 30

  crates:
    if: ${{ needs.gate.outputs.publish-crates == 'true' && needs.gate.outputs.rehearsal != 'true' }}
    needs: [gate, images, native, reproducibility, installed-sdk, oci-native]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: crates.io
    env:
      HAS_CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
      TRUSTED_PUBLISHING: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Require the source-bound publication policy before Cargo credentials
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: node scripts/release-phases.mjs policy
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: .release-sdk
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - if: ${{ env.HAS_CARGO_REGISTRY_TOKEN != 'true' && env.TRUSTED_PUBLISHING == 'true' }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
          UPLOAD: ${{ env.HAS_CARGO_REGISTRY_TOKEN == 'true' || env.TRUSTED_PUBLISHING == 'true' }}
        run: |
          set -euo pipefail
          sdk_image=$(cat .release-sdk/sdk-image.txt)
          case "$sdk_image" in
            ghcr.io/uor-foundation/prismpm-sdk@sha256:????????????????????????????????????????????????????????????????) ;;
            *) printf 'invalid SDK release identity: %s\n' "$sdk_image" >&2; exit 64 ;;
          esac
          docker run --rm \
            --user 1000:1000 \
            --env CARGO_REGISTRY_TOKEN \
            --env UPLOAD \
            --mount "type=bind,source=$PWD,target=/workspace" \
            --workdir /workspace \
            --entrypoint /bin/bash \
            "$sdk_image" \
            -euo pipefail -c '
              wait_for_crate() {
                package=$1 version=$2
                for attempt in $(seq 1 90); do
                  code=$(curl --user-agent prismpm-release/0.3 \
                    --silent --output /dev/null --write-out "%{http_code}" \
                    "https://crates.io/api/v1/crates/$package/$version")
                  if [ "$code" = 200 ]; then return 0; fi
                  sleep 10
                done
                printf "crates.io did not expose %s %s after publication\n" "$package" "$version" >&2
                return 1
              }
              public_checksum() {
                package=$1 version=$2
                response=$(mktemp)
                code=$(curl --user-agent prismpm-release/0.3 --silent --show-error \
                  --output "$response" --write-out "%{http_code}" \
                  "https://crates.io/api/v1/crates/$package/$version")
                if [ "$code" = 404 ]; then
                  rm -f "$response"
                  return 1
                fi
                test "$code" = 200
                node -e "const fs=require(\"node:fs\"); const checksum=JSON.parse(fs.readFileSync(process.argv[1],\"utf8\")).version?.checksum; if (!/^[0-9a-f]{64}$/.test(checksum ?? \"\")) process.exit(2); process.stdout.write(checksum + \"\\n\");" "$response"
                rm -f "$response"
              }
              # Without an upload credential no crate is on the registry yet, so
              # a crate that depends on others resolves them from the reviewed
              # copies through command-line patches (a patch in a manifest is
              # not read when cargo prepares a package): prod-codegen needs
              # prod-ir, owned by the same stage, and prismpm needs four,
              # named as the patch of the root manifest names them. A crate
              # that depends on none takes no patch, because one it does not
              # use changes its lock file. With a credential the dependencies
              # are published first, in order, and resolve from crates.io.
              release_cargo() {
                name=$1
                shift
                if [ "$UPLOAD" = true ]; then
                  cargo "$@"
                elif [ "$name" = prod-codegen ]; then
                  cargo "$@" \
                    --config "patch.crates-io.prod-ir.path=\"$release_sources/lean4-prod/prod-ir\""
                elif [ "$name" = prismpm ]; then
                  cargo "$@" \
                    --config "patch.crates-io.lexlean.path=\"$PWD/vendor/lexlean\"" \
                    --config "patch.crates-io.prod-ir.path=\"$PWD/vendor/lean4-prod/rust/prod-ir\"" \
                    --config "patch.crates-io.prod-codegen.path=\"$PWD/vendor/lean4-prod/rust/prod-codegen\"" \
                    --config "patch.crates-io.prism-stdlib.path=\"$PWD/stdlib/generated/package\""
                else
                  cargo "$@"
                fi
              }
              publish_exact() {
                package=$1 version=$2 manifest=$3 archive=$4 expected=$5
                package_target=${archive%/package/*}
                test "$archive" = "$package_target/package/$package-$version.crate"
                release_cargo "$package" package --locked --manifest-path "$manifest" --target-dir "$package_target"
                test -f "$archive"
                if [ "$expected" != - ]; then
                  cmp "$archive" "$expected"
                fi
                local_checksum=$(sha256sum "$archive" | cut -d" " -f1)
                release_cargo "$package" publish --dry-run --locked --manifest-path "$manifest" --target-dir "$package_target"
                test "$(sha256sum "$archive" | cut -d" " -f1)" = "$local_checksum"
                ./scripts/crate-metadata-check.sh "$archive"
                printf "%s %s sha256 %s\n" "$package" "$version" "$local_checksum"
                if observed=$(public_checksum "$package" "$version"); then
                  test "$observed" = "$local_checksum"
                  return 0
                fi
                if [ "$UPLOAD" != true ]; then
                  printf "no upload credential: %s %s was packaged and dry-run, not uploaded\n" "$package" "$version"
                  return 0
                fi
                cargo publish --locked --manifest-path "$manifest" --target-dir "$package_target"
                wait_for_crate "$package" "$version"
                observed=$(public_checksum "$package" "$version")
                test "$observed" = "$local_checksum"
              }
              # Independently released inputs must be public before a fresh
              # crates.io consumer can resolve the packaged PrismPM manifest.
              if [ "$UPLOAD" = true ]; then
                wait_for_crate lexlean 0.4.0
              fi
              release_parent=$(mktemp -d)
              release_sources="$release_parent/release-crates"
              ./scripts/package-release-crates.sh --prepare "$release_sources"
              publish_exact prod-ir 0.1.0 \
                "$release_sources/lean4-prod/prod-ir/Cargo.toml" \
                "$release_sources/lean4-prod/target/package/prod-ir-0.1.0.crate" \
                "$PWD/vendor/lean4-prod/crates/prod-ir-0.1.0.crate"
              publish_exact prod-codegen 0.1.0 \
                "$release_sources/lean4-prod/prod-codegen/Cargo.toml" \
                "$release_sources/lean4-prod/target/package/prod-codegen-0.1.0.crate" \
                "$PWD/vendor/lean4-prod/crates/prod-codegen-0.1.0.crate"
              publish_exact prism-stdlib 0.2.0 \
                "$release_sources/stdlib/Cargo.toml" \
                "$release_sources/stdlib/target/package/prism-stdlib-0.2.0.crate" \
                "$PWD/stdlib/generated/prism-stdlib-0.2.0.crate"
              publish_exact prismpm 0.4.0 crates/prismpm/Cargo.toml \
                "$PWD/target/package/prismpm-0.4.0.crate" -
              rm -rf "$release_parent"
            '

  release:
    if: ${{ needs.gate.outputs.rehearsal != 'true' }}
    needs: [gate, images, native, reproducibility, installed-sdk, oci-native, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Require the source-bound publication policy before versioned aliases
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: node scripts/release-phases.mjs policy
      - name: Require the complete Cargo-dependent publication prerequisites
        env:
          RELEASE_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/release-phases.mjs prerequisites release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: sdk-image
          path: target/release-sdk
      - id: native-amd64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-selection
          node scripts/release-artifact-metadata.mjs target/release-selection/native-amd64-provider.json "$GITHUB_RUN_ID"
          image=$(cat target/release-sdk/sdk-image.txt)
          node scripts/release-gate-evidence.mjs select-artifacts target/release-selection/native-amd64-provider.json target/release-selection/native-amd64.json \
            "$GITHUB_SHA" amd64 "$image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" native-x86_64-unknown-linux-gnu
          ids=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).artifacts.map(a=>a.id).join(","))' target/release-selection/native-amd64.json)
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native-amd64.outputs.ids }}
          merge-multiple: true
          path: release
      - id: native-arm64
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/release-selection
          node scripts/release-artifact-metadata.mjs target/release-selection/native-arm64-provider.json "$GITHUB_RUN_ID"
          image=$(cat target/release-sdk/sdk-image.txt)
          node scripts/release-gate-evidence.mjs select-artifacts target/release-selection/native-arm64-provider.json target/release-selection/native-arm64.json \
            "$GITHUB_SHA" arm64 "$image" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" native-aarch64-unknown-linux-gnu
          ids=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).artifacts.map(a=>a.id).join(","))' target/release-selection/native-arm64.json)
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.native-arm64.outputs.ids }}
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-image'
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: '*-supply-chain'
          path: release
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish accepted OCI discovery tags
        shell: bash
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          for identity_file in release/*-image.txt; do
            identity=$(cat "$identity_file")
            case "$identity" in
              ghcr.io/uor-foundation/*@sha256:????????????????????????????????????????????????????????????????) ;;
              *) printf 'invalid release image identity: %s\n' "$identity" >&2; exit 64 ;;
            esac
            repository=${identity%@*}
            expected=${identity##*@}
            docker buildx imagetools create --tag "$repository:$VERSION" "$identity"
            observed=$(docker buildx imagetools inspect "$repository:$VERSION" \
              --format '{{.Manifest.Digest}}')
            test "$observed" = "$expected"
          done
      - shell: bash
        run: |
          set -euo pipefail
          find release -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661
        with:
          subject-path: release/prismpm-*.tar.gz
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            release/*
      - name: Retain original artifact metadata and immutable selections
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: artifact-selection-${{ github.job }}-${{ matrix.arch || 'all' }}-${{ github.run_attempt }}
          path: target/release-selection/*.json
          if-no-files-found: error
          retention-days: 30

  # Explicitly exclusive from all release, acceptance and publication owners.
  diagnostic-policy:
    if: ${{ inputs.resource-diagnostic-source != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      source: ${{ steps.plan.outputs.source }}
      work-end-ms: ${{ steps.plan.outputs.work-end-ms }}
      whole-end-ms: ${{ steps.plan.outputs.whole-end-ms }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - id: plan
        name: Admit only the exact unpublished diagnostic source and common deadline
        env:
          DIAGNOSTIC_SOURCE: ${{ inputs.resource-diagnostic-source }}
          DISPATCH_VERSION: ${{ inputs.version }}
          PUBLISH_CRATES: ${{ toJSON(inputs.publish-crates) }}
          REHEARSAL: ${{ toJSON(inputs.rehearsal) }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          node scripts/native-resource-diagnostic.mjs policy >> "$GITHUB_OUTPUT"
      - name: Check diagnostic isolation and refusal contracts without construction
        run: node --test scripts/native-resource-diagnostic.test.mjs scripts/native-resource-command.test.mjs scripts/native-resource-driver.test.mjs

  diagnostic-production:
    name: Native resource production (${{ matrix.arch }})
    needs: diagnostic-policy
    if: ${{ inputs.resource-diagnostic-source != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Free only standard runner tools before the measured baseline
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup             /usr/share/swift /usr/local/share/boost /usr/local/julia* /opt/az /opt/microsoft             /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell
          df --block-size=1 /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          use: false
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - name: Run the bounded unpublished production owner
        env:
          NATIVE_DIAGNOSTIC_PLAN: ${{ needs.diagnostic-policy.outputs.plan }}
          RESOURCE_ARCH: ${{ matrix.arch }}
          RESOURCE_SOURCE: ${{ needs.diagnostic-policy.outputs.source }}
          RESOURCE_WORK_END: ${{ needs.diagnostic-policy.outputs.work-end-ms }}
          RESOURCE_WHOLE_END: ${{ needs.diagnostic-policy.outputs.whole-end-ms }}
        run: |
          set -euo pipefail
          bash scripts/native-resource-diagnostic.sh production "$RESOURCE_ARCH" "$RESOURCE_SOURCE" \
            "$RESOURCE_WORK_END" "$RESOURCE_WHOLE_END" "$RUNNER_TEMP/resource-production-$RESOURCE_ARCH"
      - name: Retain the bounded original native production subject
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-diagnostic-production-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/resource-production-${{ matrix.arch }}/production-${{ matrix.arch }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain bounded resource observations and original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-diagnostic-records-production-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/resource-production-${{ matrix.arch }}/
            !${{ runner.temp }}/resource-production-${{ matrix.arch }}/.control/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  diagnostic-pair:
    name: Native resource pair (${{ matrix.arch }})
    needs: [diagnostic-policy, diagnostic-production]
    if: ${{ inputs.resource-diagnostic-source != '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Free only standard runner tools before the measured baseline
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup             /usr/share/swift /usr/local/share/boost /usr/local/julia* /opt/az /opt/microsoft             /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell
          df --block-size=1 /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
        with:
          version: v0.28.0
          use: false
          driver-opts: image=moby/buildkit@sha256:de10faf919fc71ba4eb1dd7bd6449566d012b0c9436b1c61bfee21d621b009aa
      - id: subjects
        name: Select only exact successful current-attempt production records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/resource-selection
          node scripts/release-artifact-metadata.mjs target/resource-selection/provider.json "$GITHUB_RUN_ID"
          node scripts/native-resource-diagnostic.mjs select target/resource-selection/provider.json \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" target/resource-selection/selection.json
          ids=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).artifacts.map(a=>a.id).join(","))' target/resource-selection/selection.json)
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.subjects.outputs.ids }}
          merge-multiple: true
          path: target/resource-subjects
      - name: Run the bounded unpublished pair owner
        env:
          NATIVE_DIAGNOSTIC_PLAN: ${{ needs.diagnostic-policy.outputs.plan }}
          RESOURCE_ARCH: ${{ matrix.arch }}
          RESOURCE_SOURCE: ${{ needs.diagnostic-policy.outputs.source }}
          RESOURCE_WORK_END: ${{ needs.diagnostic-policy.outputs.work-end-ms }}
          RESOURCE_WHOLE_END: ${{ needs.diagnostic-policy.outputs.whole-end-ms }}
        run: |
          set -euo pipefail
          bash scripts/native-resource-diagnostic.sh pair "$RESOURCE_ARCH" "$RESOURCE_SOURCE" \
            "$RESOURCE_WORK_END" "$RESOURCE_WHOLE_END" "$RUNNER_TEMP/resource-pair-$RESOURCE_ARCH" "$PWD/target/resource-subjects"
      - name: Retain bounded resource observations and original failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-diagnostic-records-pair-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/resource-pair-${{ matrix.arch }}/
            !${{ runner.temp }}/resource-pair-${{ matrix.arch }}/.control/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain exact provider originals and subject selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: resource-diagnostic-selection-${{ matrix.arch }}-${{ github.sha }}-${{ github.run_attempt }}
          path: target/resource-selection/*.json
          if-no-files-found: error
          retention-days: 30
