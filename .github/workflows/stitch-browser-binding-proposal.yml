name: Propose browser fixture binding
on:
  push:
    branches: [work/stitch-browser-fixture-binding]
    paths: [.github/workflows/stitch-browser-binding-proposal.yml]
permissions:
  contents: read
concurrency:
  group: stitch-browser-binding-proposal
  cancel-in-progress: false
jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-devcontainer-runner
      - name: Generate only through the owning compiler and notation writer
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/uor-foundation/prismpm-sdk@sha256:454d1746503d62be3b9837268c4183b216ea8872e79e47d0ab694e0704a54b79
          docker pull --platform linux/amd64 "$image"
          mkdir "$RUNNER_TEMP/binding-evidence"
          cat >> crates/prismpm/src/controller/release_tests.rs <<'RS'
          #[test]
          #[ignore = "isolated binding proposal writer, never an acceptance check"]
          fn browser_system_generate_binding_proposal() {
              let temporary = browser_system_project();
              let root = temporary.path();
              let original = std::fs::read(root.join("src/Release.lex.tex")).unwrap();
              let error = Controller::load(root).unwrap().prepare(None).err().expect("stale committed binding must fail before regeneration");
              assert_eq!(error.code, "PP2101");
              std::fs::write("/evidence/before.txt", format!("{error:?}\n")).unwrap();
              bind_application_digest(root);
              let a = Controller::load(root).unwrap().prepare_release(None, Some("A")).unwrap();
              let b = Controller::load(root).unwrap().prepare_release(None, Some("B")).unwrap();
              assert_eq!(a.model_bytes, b.model_bytes);
              std::fs::write("/evidence/model.prism.json", &a.model_bytes).unwrap();
              let source = std::fs::read(root.join("src/Release.lex.tex")).unwrap();
              assert_ne!(source, original);
              std::fs::write("/evidence/Release.lex.tex", &source).unwrap();
              let output = std::process::Command::new("/usr/local/bin/prismpm")
                  .args(["--project", root.to_str().unwrap(), "--json", "check"])
                  .output().unwrap();
              std::fs::write("/evidence/check.stdout.json", &output.stdout).unwrap();
              std::fs::write("/evidence/check.stderr.txt", &output.stderr).unwrap();
              assert!(output.status.success(), "{output:?}");
              let checked: Value = serde_json::from_slice(&output.stdout).unwrap();
              assert_eq!(checked["model_id"], content_id(&a.model_bytes));
              std::fs::write(repository().join("tests/browser-system/Release.lex.tex"), source).unwrap();
          }
          RS
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE" "$RUNNER_TEMP/binding-evidence"
          docker run --rm --platform linux/amd64 --user 1000:1000 --network none --cap-drop ALL \
            --security-opt no-new-privileges --env CARGO_NET_OFFLINE=true --env CARGO_BUILD_JOBS=2 \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --mount "type=bind,source=$RUNNER_TEMP/binding-evidence,target=/evidence" \
            --workdir /work "$image" bash -c '
              set -euo pipefail
              cargo test --locked --offline -p prismpm --lib browser_system_generate_binding_proposal -- --ignored --nocapture --test-threads=1 > /evidence/generation.log 2>&1
              cargo test --locked --offline -p prismpm --lib browser_system_source_selection_and_requirements_fail_closed -- --nocapture --test-threads=1 > /evidence/regression.log 2>&1
              cargo test --locked --offline -p prismpm --lib browser_system_refuses_a_command_line_component_without_a_modeled_command_line -- --nocapture --test-threads=1 >> /evidence/regression.log 2>&1
            '
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/binding-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/binding-evidence/source.txt"
          printf '%s\n' "$image" > "$RUNNER_TEMP/binding-evidence/diagnostic-image.txt"
          (cd "$RUNNER_TEMP/binding-evidence" && sha256sum Release.lex.tex model.prism.json check.stdout.json > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-binding-proposal
          path: ${{ runner.temp }}/binding-evidence/
          if-no-files-found: error
          retention-days: 14
