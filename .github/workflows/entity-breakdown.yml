name: Root model entity breakdown (scratch diagnostic, not for merge)

on:
  push:
    branches: [probe/entity-breakdown-*]

permissions:
  contents: read

jobs:
  entities:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Print the counted entities in the pinned devcontainer
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            cargo test --locked --offline -p prismpm --test entity_breakdown -- --nocapture 2>&1 | grep -E '^ENTITY|test result|panicked|^error'
