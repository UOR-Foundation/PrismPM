name: Gate 6 residual failures (scratch diagnostic, not for merge)

on:
  push:
    branches: [probe/rust-failing-*]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Re-run the gate 6 failures outside A and B, logging outside target/
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -uo pipefail
            mkdir -p target/ci-diagnostics
            bash scripts/vv.sh --with-sdk bash -uo pipefail -c "$(cat <<'RUST_FAILING'
            log=/tmp/rust-failing.log
            cargo test --workspace --all-features --locked --offline --no-fail-fast --test conformance -- dk_17 dk_18 dk_30 ho_11 ho_13 ho_15 ho_16 ho_17 ho_18 ho_19 oc_05 oc_06 oc_07 oc_08 > $log 2>&1; echo "conformance exit $?" | tee -a $log
            cargo test --locked --offline -p xtask --bins > /tmp/xtask.log 2>&1; echo "xtask exit $?" | tee -a /tmp/xtask.log
            cargo test --locked --offline --workspace --all-features --test stdlib_compatibility > /tmp/stdlib.log 2>&1; echo "stdlib exit $?" | tee -a /tmp/stdlib.log
            grep -E "^test .*(FAILED|ok)$|test result" $log /tmp/xtask.log /tmp/stdlib.log
            cp $log /tmp/xtask.log /tmp/stdlib.log target/ci-diagnostics/
            RUST_FAILING
            )"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: rust-failing-${{ github.run_id }}
          path: target/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
