        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          submodules: false
      - name: Cut the release the certified plan allows
        env:
          GH_TOKEN: ${{ github.token }}
          CUT_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
