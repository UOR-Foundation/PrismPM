name: Private browser component owners

# The six Session file pairs and two independent compiler constructions test
# private components whose public Browser admission remains closed. They take
# about 4.5 hours, so they run nightly and on request instead of in V&V.
on:
  schedule:
    - cron: '47 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owners:
    name: Private browser component owners
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - name: Run the private component owners in the pinned devcontainer
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            bash scripts/vv.sh --with-sdk bash -euo pipefail -c "$(cat <<'PRISMPM_VV'
            node scripts/browser-api-sdk-check.mjs standalone
            node --test --test-concurrency=1 --test-timeout=3600000 tests/browser-operation-journal/fallback-owner.test.mjs tests/browser-budget/fallback-owner.test.mjs
            PRISMPM_VV
            )"
