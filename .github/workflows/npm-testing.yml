name: npm testing

# The test helpers in sdk/npm/testing (#286). Short, path-filtered and outside the
# devcontainer, like npm-conformance.yml. It runs when the package changes and when
# anything it drives changes: prism-code's source, its reference archives and
# histories, and the spec package it builds from. The guide that runs its examples
# is checked by docs-generate.yml. There is no publish job.

on:
  pull_request:
    paths:
      - sdk/npm/testing/**
      - sdk/npm/prism-code/src/**
      - sdk/npm/prism-code/fixtures/**
      - sdk/npm/prism-code/package.json
      - sdk/npm/spec/**
      - .github/workflows/npm-testing.yml
  push:
    branches: [main]
    paths:
      - sdk/npm/testing/**
      - sdk/npm/prism-code/src/**
      - sdk/npm/prism-code/fixtures/**
      - sdk/npm/prism-code/package.json
      - sdk/npm/spec/**
      - .github/workflows/npm-testing.yml

permissions:
  contents: read

concurrency:
  group: npm-testing-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      # Pull requests test every OS on Node 24 and Node 22 on Linux only; main
      # pushes run the full OS x Node matrix.
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        node: ${{ fromJSON(github.event_name == 'pull_request' && '["24"]' || '["22", "24"]') }}
        include:
          - os: ubuntu-24.04
            node: '22'
    defaults:
      run:
        working-directory: sdk/npm/testing
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      # prism-code imports the spec package's generated entry point, which is not committed.
      - name: Build the spec package's generated entry point
        working-directory: sdk/npm/spec
        run: npm run build
      # The package resolves prism-code, its peer, through a link to the checkout.
      - name: Link prism-code
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - name: Unit tests
        run: node --test "test/*.test.mjs"
      # The reference-archive test of prism-code is written with this package.
      - name: The reference archives, through this package
        working-directory: sdk/npm/prism-code
        run: node --test test/reference-archives.test.mjs
      - name: Package size and contents
        shell: bash
        run: |
          set -euo pipefail
          npm pack --dry-run --json > pack.json
          node -e '
            const pack = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))[0];
            console.log(`unpacked size: ${pack.unpackedSize} bytes, ${pack.entryCount} files`);
            if (pack.unpackedSize > 65536) throw new Error("package exceeds 64 KiB");
            const paths = pack.files.map((f) => f.path);
            const stray = paths.filter((p) => /^(test|node_modules)\//.test(p));
            if (stray.length) throw new Error(`repository files in the package: ${stray}`);
            for (const required of ["src/index.mjs", "index.d.ts", "README.md", "LICENSE"]) {
              if (!paths.includes(required)) throw new Error(`missing from the package: ${required}`);
            }
          '
          rm pack.json
