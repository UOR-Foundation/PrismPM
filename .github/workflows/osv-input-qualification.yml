name: PR192 real SDK scheduling qualification

on:
  workflow_dispatch:
    inputs:
      qualification_source_revision:
        description: Exact reviewed preparation commit; not a product SDK revision
        required: true
        type: string
      allow_expensive_sdk_calls:
        description: Maintainer has reviewed queue, capacity and seven full historical SDK imports
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact historical consumer and explicit cost authorization
        env:
          ALLOW_EXPENSIVE_SDK_CALLS: ${{ inputs.allow_expensive_sdk_calls }}
          QUALIFICATION_SOURCE_REVISION: ${{ inputs.qualification_source_revision }}
        run: python3 -B qualification/pr192-sdk-scheduling/observe.py admit

  default-check:
    needs: admit
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: check
      context: qualification/pr192-sdk-scheduling/consumer

  default-build:
    needs: admit
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: build
      context: qualification/pr192-sdk-scheduling/consumer
      reference: ghcr.io/uor-foundation/prismpm-scheduling-local:default-build

  mutating-fetch-a:
    needs: [default-check, default-build]
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: fetch
      context: qualification/pr192-sdk-scheduling/consumer
      invocation-key: mutating-same-key

  mutating-fetch-b:
    needs: [default-check, default-build]
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: fetch
      context: qualification/pr192-sdk-scheduling/consumer
      invocation-key: mutating-same-key

  keyed-older:
    needs: [mutating-fetch-a, mutating-fetch-b]
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: build
      context: qualification/pr192-sdk-scheduling/consumer
      reference: ghcr.io/uor-foundation/prismpm-scheduling-local:keyed-older
      invocation-key: readonly-replace

  keyed-isolated:
    needs: [mutating-fetch-a, mutating-fetch-b]
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: build
      context: qualification/pr192-sdk-scheduling/consumer
      reference: ghcr.io/uor-foundation/prismpm-scheduling-local:keyed-isolated
      invocation-key: readonly-isolated

  keyed-newer:
    needs: observe-replacement
    uses: PhaseMirror/PrismPM/.github/workflows/sdk.yml@83b7d9a9905c1bfef787e418ec5e9cc8e0f46453
    with:
      sdk-image: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:60226bc791d4c0e5613402a6be7e63f4963d3faf7f327befcf56fc0e41d0ce21
      command: build
      context: qualification/pr192-sdk-scheduling/consumer
      reference: ghcr.io/uor-foundation/prismpm-scheduling-local:keyed-newer
      invocation-key: readonly-replace

  observe-replacement:
    needs: [mutating-fetch-a, mutating-fetch-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    outputs:
      observation: ${{ steps.observe.outputs.observation }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - id: observe
        name: Observe both genuine readonly SDK operations before same-key replacement
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B qualification/pr192-sdk-scheduling/observe.py observe
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr192-readonly-provider-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-scheduling-observe/
          if-no-files-found: error
          retention-days: 7

  verify-scheduling:
    if: always()
    needs: [admit, default-check, default-build, mutating-fetch-a, mutating-fetch-b, keyed-older, keyed-isolated, keyed-newer, observe-replacement]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify actual independent calls, safe replacement and key isolation
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACEMENT_OBSERVATION: ${{ needs.observe-replacement.outputs.observation }}
        run: python3 -B qualification/pr192-sdk-scheduling/observe.py finish
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr192-scheduling-readback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sdk-scheduling-finish/
          if-no-files-found: error
          retention-days: 7
