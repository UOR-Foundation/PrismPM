name: Verification & Validation

# Full normative acceptance runs once per main push. It covers
# every gate of the repository verification recipe, including the workspace unit tests, all
# conformance suites, Lean proofs, packaging, dependency policy and the
# two-root reproducibility comparison, so none of those are repeated per PR.
# Start it on a PR head with workflow_dispatch when a merge candidate needs
# the full result before merging.
#
# One complete pass outgrows the 6 hour limit and the disk of a hosted job, so
# it runs as separate parts on one commit. A failed part can be re-run alone,
# and the `complete` job passes only with all of them.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build the pinned devcontainer once
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      - uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          cacheTo: ${{ steps.cache.outputs.cache-to }}
          push: never
          runCmd: 'true'

  vv:
    name: Linux x86-64 normative acceptance (${{ matrix.part }})
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        part: [source, gates, conformance, ho-oc, st-sy, dk-0-1, dk-2, dk-3]
    steps:
      # A full gate 6 otherwise exhausts the hosted runner disk (ENOSPC). The conformance part
      # drops from 107 GiB free to under 10 GiB by OC-10, whose capture requires 10 GiB.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/boost /usr/local/julia* /opt/az /opt/microsoft \
            /usr/lib/jvm /usr/share/miniconda /usr/local/share/powershell
          df -h /
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The bootstrap gate archives its exact accepted historical source.
          fetch-depth: 0
          persist-credentials: false
      - name: Check pinned bootstrap source availability
        run: bash scripts/bootstrap-verify.sh --check-source
      - name: Start bounded host resource diagnostics
        run: node scripts/ci-observe.mjs start target/ci-diagnostics/host
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      # Materialize the same pinned official uploader used below. Periodic
      # small snapshots can survive runner loss before the final artifact step.
      - name: Prepare pinned checkpoint uploader
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
          path: .ci-checkpoint-uploader
          persist-credentials: false
      - name: Start disk checkpoints
        timeout-minutes: 1
        continue-on-error: true
        run: |
          set -euo pipefail
          trap 'rm -rf .ci-checkpoint-uploader' EXIT
          cp .ci-checkpoint-uploader/dist/upload/index.js "$RUNNER_TEMP/ci-checkpoint-uploader.js"
          rm -rf .ci-checkpoint-uploader
          node scripts/ci-disk-checkpoint.mjs start "$RUNNER_TEMP/ci-disk-checkpoints" "$RUNNER_TEMP/ci-checkpoint-uploader.js"
      - name: Run this part in the pinned devcontainer
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          push: never
          runCmd: |
            set -euo pipefail
            bash scripts/vv.sh --with-sdk bash -euo pipefail -c "$(cat <<'PRISMPM_VV'
            node scripts/ci-observe.mjs run target/ci-diagnostics/vv -- just vv-part ${{ matrix.part }}
            PRISMPM_VV
            )"
      - name: Stop disk checkpoints
        timeout-minutes: 1
        if: always()
        continue-on-error: true
        run: |
          node scripts/ci-disk-checkpoint.mjs stop "$RUNNER_TEMP/ci-disk-checkpoints" || true
          mkdir -p target/ci-diagnostics/disk-checkpoints
          if test -f "$RUNNER_TEMP/ci-disk-checkpoints/status.json"; then
            cp "$RUNNER_TEMP/ci-disk-checkpoints/status.json" target/ci-diagnostics/disk-checkpoints/status.json
          fi
          if test -f "$RUNNER_TEMP/ci-disk-checkpoints/latest.json"; then
            cp "$RUNNER_TEMP/ci-disk-checkpoints/latest.json" target/ci-diagnostics/disk-checkpoints/latest.json
          fi
      - name: Stop host resource diagnostics
        if: always()
        run: node scripts/ci-observe.mjs stop target/ci-diagnostics/host
      - name: Retain CI diagnostics (not acceptance evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vv-diagnostics-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain this part's result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vv-part-${{ matrix.part }}
          path: target/vv-part-${{ matrix.part }}.json
          if-no-files-found: error
          retention-days: 30

  complete:
    name: Linux x86-64 normative acceptance
    needs: vv
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: vv-part-*
          merge-multiple: true
          path: target/vv-parts
      - name: Require every part on this commit
        run: |
          node --test scripts/vv-assemble.test.mjs
          node scripts/vv-assemble.mjs target/vv-parts target/vv-evidence.json "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vv-evidence
          path: target/vv-evidence.json
          if-no-files-found: error
          retention-days: 30
