name: Verification & Validation

# Full normative acceptance runs once per main push or release tag. It covers
# every gate of the repository verification recipe, including the workspace unit tests, all
# conformance suites, Lean proofs, packaging, dependency policy and the
# two-root reproducibility comparison, so none of those are repeated per PR.
# Start it on a PR head with workflow_dispatch when a merge candidate needs
# the full result before merging.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-parts:
    name: source-vv-part-${{ matrix.part }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        part: [source, gates, conformance, ho-oc, st-sy, dk-0-1, dk-2, dk-3, dk-4, standalone-projection, standalone-reservation, standalone-payload, standalone-recovery-frames, standalone-journal-recovery, standalone-retention]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The bootstrap gate archives its exact accepted historical source.
          fetch-depth: 0
          persist-credentials: false
      - name: Check pinned bootstrap source availability
        run: bash scripts/bootstrap-verify.sh --check-source
      - name: Start bounded host resource diagnostics
        run: node scripts/ci-observe.mjs start target/ci-diagnostics/host
      - id: cache
        uses: ./.github/actions/devcontainer-cache
      # Materialize the same pinned official uploader used below. Periodic
      # small snapshots can survive runner loss before the final artifact step.
      - name: Prepare pinned checkpoint uploader
        timeout-minutes: 2
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: actions/upload-artifact
          ref: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
          path: .ci-checkpoint-uploader
          persist-credentials: false
      - name: Start disk checkpoints
        timeout-minutes: 1
        continue-on-error: true
        env:
          PRISMPM_CI_CHECKPOINT_PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          trap 'rm -rf .ci-checkpoint-uploader' EXIT
          cp .ci-checkpoint-uploader/dist/upload/index.js "$RUNNER_TEMP/ci-checkpoint-uploader.js"
          rm -rf .ci-checkpoint-uploader
          node scripts/ci-disk-checkpoint.mjs start "$RUNNER_TEMP/ci-disk-checkpoints" "$RUNNER_TEMP/ci-checkpoint-uploader.js"
      - id: evidence
        env:
          VV_PART: ${{ matrix.part }}
        run: |
          set -euo pipefail
          name=$(node scripts/release-gate-evidence.mjs artifact-name "source-vv-part-$VV_PART" "$GITHUB_SHA" amd64 - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          printf 'name=%s\n' "$name" >> "$GITHUB_OUTPUT"
      - name: Run the complete pinned devcontainer source part
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        env:
          VV_PART: ${{ matrix.part }}
        with:
          env: |
            GITHUB_SHA
            GITHUB_RUN_ID
            GITHUB_RUN_ATTEMPT
            VV_PART
          cacheFrom: ${{ steps.cache.outputs.cache-from }}
          cacheTo: ${{ steps.cache.outputs.cache-to }}
          push: never
          # Temporary invocation-local SDK preparation repeats for each part.
          # A shared internal handoff requires a separately reviewed contract.
          runCmd: |
            set -euo pipefail
            bash scripts/vv.sh --with-sdk bash -euo pipefail -c "$(cat <<'PRISMPM_VV'
            node scripts/ci-observe.mjs run target/ci-diagnostics/vv -- node scripts/release-gate-evidence.mjs source-part-run . target/source-vv-evidence "$GITHUB_SHA" amd64 - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$VV_PART"
            PRISMPM_VV
            )"
      - name: Stop disk checkpoints
        timeout-minutes: 1
        if: always()
        continue-on-error: true
        run: |
          node scripts/ci-disk-checkpoint.mjs stop "$RUNNER_TEMP/ci-disk-checkpoints" || true
          mkdir -p target/ci-diagnostics/disk-checkpoints
          if test -f "$RUNNER_TEMP/ci-disk-checkpoints/status.json"; then
            cp "$RUNNER_TEMP/ci-disk-checkpoints/status.json" target/ci-diagnostics/disk-checkpoints/status.json
          fi
          if test -f "$RUNNER_TEMP/ci-disk-checkpoints/latest.json"; then
            cp "$RUNNER_TEMP/ci-disk-checkpoints/latest.json" target/ci-diagnostics/disk-checkpoints/latest.json
          fi
      - name: Stop host resource diagnostics
        if: always()
        run: node scripts/ci-observe.mjs stop target/ci-diagnostics/host
      - name: Retain CI diagnostics (not acceptance evidence)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vv-diagnostics-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci-diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Retain original source part evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.evidence.outputs.name }}
          path: target/source-vv-evidence/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  vv:
    name: Linux x86-64 normative acceptance
    needs: source-parts
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require every source part to succeed
        env:
          SOURCE_PARTS_RESULT: ${{ needs.source-parts.result }}
        run: |
          set -euo pipefail
          test "$SOURCE_PARTS_RESULT" = success
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - id: selection
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/source-vv-selection
          node scripts/release-artifact-metadata.mjs target/source-vv-selection/provider.json "$GITHUB_RUN_ID"
          owners=$(node scripts/vv-assemble.mjs --list | sed 's/[^[:space:]]\+/source-vv-part-&/g')
          node scripts/release-gate-evidence.mjs select-artifacts target/source-vv-selection/provider.json target/source-vv-selection/selection.json \
            "$GITHUB_SHA" amd64 - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" $owners
          ids=$(node -e 'const fs=require("node:fs"); console.log(JSON.parse(fs.readFileSync(process.argv[1])).artifacts.map(a=>a.id).join(","))' target/source-vv-selection/selection.json)
          printf 'ids=%s\n' "$ids" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.selection.outputs.ids }}
          merge-multiple: true
          path: target/source-vv-evidence
      - name: Assemble every original source part into normative evidence
        run: |
          set -euo pipefail
          node scripts/release-gate-evidence.mjs source-part-assemble . target/source-vv-evidence \
            "$GITHUB_SHA" amd64 - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            target/source-vv-selection/provider.json target/source-vv-selection/selection.json
      - name: Retain original source parts and immutable selection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vv-source-evidence-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/source-vv-evidence/
            target/source-vv-selection/
            target/vv-evidence.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 30
