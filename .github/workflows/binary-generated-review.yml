name: Prepare BinaryProgram generated-source review
run-name: Binary generated-source review · ${{ github.sha }}

on:
  push:
    branches: [work/binary-generated-review]
  workflow_dispatch:
    inputs:
      source_revision:
        description: Exact selected commit; must equal the dispatched ref SHA
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: binary-generated-review
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_REVISION: ${{ inputs.source_revision || github.sha }}
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22.23.2
      - name: Bind the exact selected source before running any writer
        shell: bash
        run: |
          set -euo pipefail
          [[ $SOURCE_REVISION =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_REVISION" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test -z "$(git status --porcelain)"
          node scripts/binary-sdk-check.mjs tests
          mkdir -p target/binary-generated-review
          printf '%s\n' "$SOURCE_REVISION" > target/binary-generated-review/source-revision.txt
          git rev-parse HEAD^{tree} > target/binary-generated-review/source-tree.txt
          cp model/dependencies.toml target/binary-generated-review/dependencies.toml
          cp Cargo.lock target/binary-generated-review/Cargo.lock
      - name: Run the unchanged owning writers and their checks in the pinned devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca
        with:
          push: never
          runCmd: |
            set -euo pipefail
            source_revision="$(cat target/binary-generated-review/source-revision.txt)"
            test "$(git rev-parse HEAD)" = "$source_revision"
            exec > target/binary-generated-review/generation.log 2>&1
            rustc --version
            cargo --version
            lean --version
            just --version
            just codegen
            just fixtures-write
            just golden-write "BinaryProgram prerequisite PR #186: exact source $source_revision"
            just stdlib-package-write
            stage="$(mktemp -d)"
            trap 'rm -r -- "$stage"' EXIT
            cp -a stdlib/generated/package "$stage/stdlib"
            (
              cd "$stage/stdlib"
              CARGO_NET_OFFLINE=true cargo package --locked --offline --target-dir target
            )
            cp "$stage/stdlib/target/package/prism-stdlib-0.2.0.crate" \
              stdlib/generated/prism-stdlib-0.2.0.crate
            crate_sha="$(sha256sum stdlib/generated/prism-stdlib-0.2.0.crate | cut -d' ' -f1)"
            semantic_id="$(python3 - <<'PY'
            import json
            print(json.load(open("tests/golden/stdlib/build/model.prism.json"))["provenance"]["semantic_id"])
            PY
            )"
            python3 - "$crate_sha" "$semantic_id" <<'PY'
            import json, pathlib, sys
            crate_sha, semantic_id = sys.argv[1:]
            value = {
                "crate_path": "stdlib/generated/prism-stdlib-0.2.0.crate",
                "crate_sha256": crate_sha,
                "schema": "prismpm/stdlib-release/1",
                "semantic_id": semantic_id,
            }
            pathlib.Path("stdlib/release.json").write_text(
                json.dumps(value, separators=(",", ":"), sort_keys=True)
            )
            PY
            just golden-check
            just stdlib-package-check
            just check-fixtures
            just package-release-crates-check
            node scripts/reconcile-lexlean.mjs --validate-generated
      - name: Preserve only an inert review patch after all owning checks pass
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          evidence=target/binary-generated-review
          git diff --check
          git add -N -- .
          git diff --binary HEAD > "$evidence/generated.patch"
          git diff --name-status HEAD > "$evidence/changed-paths.txt"
          printf '%s\n' \
            'Review-only generated-source proposal. Not SDK acceptance or a release. Source, native golden, installed SDK, security, reproducibility and release gates remain mandatory.' \
            > "$evidence/UNACCEPTED.txt"
          (cd "$evidence" && sha256sum source-revision.txt source-tree.txt dependencies.toml Cargo.lock generation.log generated.patch changed-paths.txt UNACCEPTED.txt > SHA256SUMS)
      - name: Preserve diagnostic status even when preparation fails
        if: always()
        shell: bash
        env:
          PREPARATION_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p target/binary-generated-review
          printf '%s\n' "$PREPARATION_STATUS" > target/binary-generated-review/job-status.txt
          printf '%s\n' "$SOURCE_REVISION" > target/binary-generated-review/selected-source.txt
          printf '%s\n' \
            'Preparation evidence only. A partial or failed run does not provide an accepted patch or any SDK qualification.' \
            > target/binary-generated-review/DIAGNOSTIC-ONLY.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: binary-generated-review-${{ github.sha }}
          path: target/binary-generated-review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
