name: Source Workspace Unit Followthrough

on:
  push:
    branches: [ci/sdk-source-unit-public-f43f6778-2026-10-20]

permissions:
  contents: read

jobs:
  workspace-unit:
    name: Workspace Unit Tests / same-source public SDK followthrough
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: f43f6778cb13b59601254143594e4e5547e01ff2
          fetch-depth: 0
      - name: Verify the exact clean source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f43f6778cb13b59601254143594e4e5547e01ff2
          test "$(git rev-parse HEAD^{tree})" = 9cd989611e4b8f87dbe6a810957306bcc2fcb3f8
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'source=%s tree=%s helper_head=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$GITHUB_SHA"
      - name: Run the unchanged complete Unit owner with the verified same-source SDK
        uses: devcontainers/ci@8bf61b26e9c3a98f69cb6ce2f88d24ff59b785c6 # v0.3.1900000417
        with:
          push: never
          runCmd: |
            set -euo pipefail
            test "$(git rev-parse HEAD)" = f43f6778cb13b59601254143594e4e5547e01ff2
            test "$(git rev-parse HEAD^{tree})" = 9cd989611e4b8f87dbe6a810957306bcc2fcb3f8
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            export PRISMPM_TEST_SDK_IMAGE=ghcr.io/afflom/lexlean-matmul-sdk@sha256:f98ba2c32336acf02f809da3af49bf81ac5c62af1fed03e69576daa93f853f47
            docker pull --platform linux/amd64 "$PRISMPM_TEST_SDK_IMAGE"
            test "$(docker image inspect "$PRISMPM_TEST_SDK_IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
            test "$(docker image inspect "$PRISMPM_TEST_SDK_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = f43f6778cb13b59601254143594e4e5547e01ff2
            test "$(docker image inspect "$PRISMPM_TEST_SDK_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.source"}}')" = https://github.com/UOR-Foundation/PrismPM
            printf 'source=%s tree=%s sdk=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$PRISMPM_TEST_SDK_IMAGE"
            docker image inspect "$PRISMPM_TEST_SDK_IMAGE" --format '{"id":{{json .Id}},"os":{{json .Os}},"architecture":{{json .Architecture}},"repo_digests":{{json .RepoDigests}},"labels":{{json .Config.Labels}}}'
            ./scripts/vv.sh unit-tests
