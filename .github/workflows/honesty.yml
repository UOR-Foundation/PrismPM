name: Honesty Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  honesty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Validate Model & Spec Links
        run: cargo run --package xtask -- validate

