name: Factory compiler binding regeneration
on:
  push:
    branches: [work/stitch-factory-compiler-binding]
    paths: [.github/workflows/factory-binding-regenerate.yml]
permissions:
  contents: read
concurrency:
  group: factory-binding-regenerate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the repository-pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ELAN_HOME="$RUNNER_TEMP/factory-elan"
          curl --fail --location --retry 3 https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz -o "$RUNNER_TEMP/elan.tar.gz"
          echo "df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/elan-installer"
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP/elan-installer"
          "$RUNNER_TEMP/elan-installer/elan-init" -y --no-modify-path --default-toolchain none
          "$ELAN_HOME/bin/elan" toolchain install leanprover/lean4:v4.32.1
          echo "ELAN_HOME=$ELAN_HOME" >> "$GITHUB_ENV"
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
      - name: Regenerate through the admitted compiler and original production owner
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/factory-binding"
          mkdir -p "$out"
          git rev-parse HEAD > "$out/source.txt"
          sha256sum vendor/lexlean/MANIFEST.sha256 vendor/lexlean/lexlean-0.4.0.crate > "$out/compiler-package.sha256"
          cat vendor/lexlean/.cargo_vcs_info.json > "$out/compiler-vcs.json"
          cargo build --release --locked --manifest-path vendor/lexlean/Cargo.toml --bin lexlean --target-dir "$PWD/target/lexlean"
          lexlean="$PWD/target/lexlean/release/lexlean"
          "$lexlean" --version | tee "$out/compiler-version.txt"
          if "$lexlean" production verify-artifact prism-factory/certified > "$out/baseline-replay.log" 2>&1; then
            echo "Expected the old compiler-bound bundle to be refused" >&2
            exit 1
          fi
          grep -F 'LLV7102' "$out/baseline-replay.log"
          "$lexlean" production targets > "$out/targets.json"
          (cd prism-factory/model && "$lexlean" lock && "$lexlean" lock --check && "$lexlean" verify --all) 2>&1 | tee "$out/model-verification.log"
          (cd prism-factory/model && "$lexlean" production build --request ../production-request.json) 2>&1 | tee "$out/production-build.log"
          result=$(sed -n 's/.*; result \([0-9a-f]\{64\}\);.*/\1/p' "$out/production-build.log")
          test "${#result}" = 64
          test -f "prism-factory/model/.lexlean/production/$result/result.json"
          mv prism-factory/certified "$RUNNER_TEMP/original-certified"
          cp -a "prism-factory/model/.lexlean/production/$result" prism-factory/certified
          "$lexlean" production verify-artifact prism-factory/certified 2>&1 | tee "$out/fresh-replay.log"
          bash prism-factory/check.sh 2>&1 | tee "$out/original-factory-check.log"
          git diff --exit-code -- .github/workflows/release.yml .github/workflows/factory.yml prism-factory/model/src prism-factory/std vendor/lexlean
          git add -N -- prism-factory/certified
          git diff --check
          git diff --binary HEAD -- prism-factory/model/lexlean.lock prism-factory/certified > "$out/generated.patch"
          cp prism-factory/model/lexlean.lock "$out/lexlean.lock"
          cp -a prism-factory/certified "$out/certified"
          (cd "$out" && find certified -type f -print0 | sort -z | xargs -0 sha256sum > bundle.sha256)
          (cd "$out" && sha256sum generated.patch lexlean.lock source.txt compiler-vcs.json compiler-package.sha256 > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: factory-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/factory-binding/
          if-no-files-found: error
          retention-days: 30
