# The consumer's workspace of the echo server. The core package and the two host
# packages are generated by `prismpm build` and laid beside the binding; the
# profile that bounds the release build is the consumer's.
[workspace]
resolver = "2"
members = ["echo_server_core", "echo-server-host-api", "echo-server-host", "bindings/echo-binding"]

[profile.dev]
debug = 0
