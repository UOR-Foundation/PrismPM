[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Alex Flom"]
keywords = ["prismpm", "lean", "latex", "architecture", "security"]
categories = ["compilers", "development-tools"]

[workspace.dependencies]
repo-model = { version = "0.1.0", path = "crates/model" }
repo-conformance = { version = "0.1.0", path = "crates/conformance" }
prismpm = { version = "0.1.0", path = "crates/prismpm" }
lexlean = { version = "0.1.1", path = "../LexLean/crates/lexlean" }

camino = "1.2"
clap = { version = "4.5", features = ["derive"] }
fs4 = { version = "0.13", features = ["sync"] }
proptest = "1.6"
same-file = "1.0"
semver = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = "0.8"
unicode-normalization = "0.1"
walkdir = "2"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

