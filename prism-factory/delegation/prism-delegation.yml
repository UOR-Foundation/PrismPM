name: Prism delegation
on:
  pull_request:
  push:
    branches: [main, 'release/v*']
    tags: ['v*']
  workflow_dispatch:
  repository_dispatch:
    types: [prism-verdict]
permissions:
  contents: read
concurrency:
  group: prism-delegation-${{ github.event_name }}-${{ github.event.client_payload.revision || github.ref }}
  cancel-in-progress: true
jobs:
  submit:
    if: ${{ github.event_name != 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: false
      - name: Submit the workload to the Prism node
        run: bash prism-factory/factory.sh delegate-submit
  verify:
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.client_payload.revision }}
          submodules: false
      - name: Verify the node's receipts and report them
        env:
          PRISM_VERDICT: ${{ toJSON(github.event.client_payload) }}
        run: bash prism-factory/factory.sh delegate-verify
