spec = "lexlean/project/1"
name = "prismpm-bindings"
language = "1.2"
module_prefix = "PrismPM"
source_roots = ["src"]
entrypoints = ["src/Foundation/Bindings/V1/Generate.lex.tex", "src/Foundation/Bindings/V1/Js.lex.tex", "src/Foundation/Bindings/V1/Model.lex.tex", "src/Foundation/Bindings/V1/Python.lex.tex", "src/Foundation/Bindings/V1/Rust.lex.tex", "src/Foundation/Bindings/V1/Source.lex.tex", "src/Foundation/Bindings/V1/Text.lex.tex", "src/Foundation/Images/V1/Store.lex.tex", "src/Foundation/Proof/V1/Statement.lex.tex"]
build_root = ".lexlean"
lockfile = "lexlean.lock"
lean_workspace = "."
lean_toolchain = "leanprover/lean4:v4.32.1"

[[lexicon_source]]
package = "lexlean.std.nat"
kind = "builtin"

[[lexicon_source]]
package = "prism.bindings"
kind = "path"
path = "language/prism.bindings"
[limits]
max_file_bytes = 4194304
max_total_source_bytes = 67108864
max_primitive_atoms = 2000000
max_token_lattice_edges = 4000000
max_parse_states = 4000000
max_ir_nodes = 2000000
max_scope_depth = 1024
max_import_depth = 128
max_diagnostics = 256
max_child_output_bytes = 16777216
child_timeout_ms = 300000
