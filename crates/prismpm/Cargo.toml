[package]
name = "prismpm"
description = "Prism Platform Model Framework"
repository = "https://github.com/UOR-Foundation/PrismPM"
homepage = "https://github.com/UOR-Foundation/PrismPM"
documentation = "https://docs.rs/prismpm"
readme = "README.md"
include = [
    "Cargo.toml",
    "CHANGELOG.md",
    "CONFORMANCE.md",
    "ERRORS.md",
    "LICENSE-APACHE",
    "LICENSE-MIT",
    "README.md",
    "RELEASE-STATUS.md",
    "SPEC.md",
    "adapters/**",
    "language/**",
    "model/**",
    "schemas/**",
    "sdk/asyncapi-runtime/package.json",
    "sdk/asyncapi-runtime/package-lock.json",
    "sdk/asyncapi-runtime/launcher.mjs",
    "sdk/asyncapi-runtime/launcher.sh",
    "sdk/asyncapi-runtime/launcher.test.mjs",
    "sdk/oracles/asyncapi-parser.mjs",
    "sdk/oracles/kubernetes-validator.mjs",
    "sdk/oracles/go/intoto-statement-validator/main.go",
    "sdk/stdlib-sources.tar",
    "sdk/platform-lock.mjs",
    "sdk/browser/identity.mjs",
    "sdk/browser/store.mjs",
    "sdk/browser/peer.mjs",
    "sdk/browser/journal.mjs",
    "src/**",
    "standards.lock",
    "stdlib/README.md",
    "stdlib/LICENSE-APACHE",
    "stdlib/LICENSE-MIT",
    "stdlib/release.json",
    "stdlib/generated/prism-stdlib-0.2.0.crate",
    "stdlib/src/**",
    "standards/corpora/cosign-3.1.3/**",
    "standards/corpora/devcontainer-c95ffeed/**",
    "standards/corpora/github-signed-tags/**",
    "standards/corpora/kubernetes-1.36.4/**",
    "standards/corpora/slsa-verifier-2.7.1/**",
    "standards/oracles/openapi-3.2-schema-2025-11-23.json",
    "standards/oracles/osv-b388-schema.json",
    "standards/trust/**",
    "tests/production.rs",
    "tests/data/holo-codec-v1.json",
    "vendor/hologram-live.tar",
    "vendor/lean4-prod/lean.tar",
    "vendor/registry.tar",
]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
base64 = { workspace = true }
blake3 = { workspace = true }
camino = { workspace = true }
clap = { workspace = true }
ctrlc = { workspace = true }
fs4 = { workspace = true }
jsonschema = { workspace = true }
lexlean = { workspace = true }
prod-codegen = { workspace = true }
prod-ir = { workspace = true }
prism-stdlib = { workspace = true }
same-file = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
tar = { workspace = true }
toml = { workspace = true }
unicode-normalization = { workspace = true }
walkdir = { workspace = true }
x509-parser = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
