# tools.lock --- pinned toolchains and binary dependencies for PrismPM

[support]
# The first release has one supported/normative host. Additional hosts are not
# claimed until their installer bytes and complete build/API matrix are pinned.
hosts = ["x86_64-unknown-linux-gnu"]

[rust]
version = "1.97.1"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-analyzer"]

[rustup]
version = "1.28.2"
platform = "x86_64-unknown-linux-gnu"
url = "https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init"
sha256 = "20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c"

[lean]
version = "v4.32.1"
release = "leanprover/lean4:v4.32.1"
