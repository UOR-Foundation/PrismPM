[package]
name = "prismpm-hologram-oracle"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
axum = "=0.8.9"
hologram-live = { path = "../hologram-live" }
hologram-view-surface = { path = "../hologram-live/crates/hologram-view-surface" }
hologram = { package = "uor-hologram", git = "https://github.com/Hologram-Technologies/hologram", rev = "2bda6a9a9476872dade705bd61ece4209607f6da", default-features = false, features = ["archive", "space"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"
