# runtime roots. Signatures preserve the original 0.1.x consumer contract;
# executable semantics remain exclusively in the named LexLean declarations.
# Baseline: 94697b1ff196ef362f4a6137ba72145e2ac68faf,
# stdlib/generated/package/src/lib.rs (acceptance needs no network or Git history).
