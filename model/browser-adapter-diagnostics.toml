spec = "prismpm/browser-adapter-diagnostics/1"

[[adapter]]
error_class = "CommandAdapterError"
source = "sdk/browser/commands.mjs"
capability = "DK-13"
model_source = "stdlib/src/Foundation/Browser/V1/WorkspaceCommand.lex.tex"
rejection_error = "command-rejected"

[[adapter.error]]
code = "adapter-busy"
statement = "Two operations are already owned; additional work is rejected before intent capture."

[[adapter.error]]
code = "adapter-closed"
statement = "The adapter is closed; captured or late work cannot expose a result or begin a new effect."

[[adapter.error]]
code = "command-rejected"
statement = "The generated Command rejected the operation; detail is exactly its registered one-byte failure."

[[adapter.error]]
code = "commit-outcome-unknown"
statement = "Close occurred during an already started durable write; no rollback is claimed and reopening must replay."

[[adapter.error]]
code = "generated-execution-failed"
statement = "The trusted generated guest trapped or could not execute; no successful result is exposed."

[[adapter.error]]
code = "identity-missing"
statement = "The private storage namespace has no persisted identity."

[[adapter.error]]
code = "invalid-effect-result"
statement = "A trusted-boundary hash is not a canonical lowercase SHA-256 identifier."

[[adapter.error]]
code = "invalid-generated-module"
statement = "Trusted bootstrap did not provide the expected import-free generated module and exports."

[[adapter.error]]
code = "invalid-generated-output"
statement = "Generated output framing, bounds or required fields are invalid."

[[adapter.error]]
code = "invalid-input"
statement = "The call has an invalid argument count, closed intent shape, type or byte bound."

[[adapter.error]]
code = "refresh-required"
statement = "A failed or uncertain command requires explicit complete authenticated replay before another write."

[[adapter.error]]
code = "request-limit"
statement = "The private guest request exceeds the exact modeled allocation cap before guest execution."

[[adapter.error]]
code = "storage-outcome-unknown"
statement = "An unknown storage exception is replaced by a stable code without retaining its message, payload or cause."

