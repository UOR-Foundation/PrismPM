spec = "prismpm/host-effects-diagnostics/1"
# Closed failure vocabulary of generated server host adapters. Codes are the
# constructors of Foundation.Server.V1.Model.ServerFailure in order, the
# Failure enum of the generated host library and the diagnostics printed on
# standard error. Class selects the modeled exit code: usage_code, io_code or
# fault_code.

[[failure]]
code = "UnknownFlag"
class = "usage"
statement = "An argument beginning with a dash is neither --help, --version, - nor the -- terminator."

[[failure]]
code = "ExtraArgument"
class = "usage"
statement = "More positional arguments were given than the exchange command accepts."

[[failure]]
code = "MissingCommand"
class = "usage"
statement = "No command was given."

[[failure]]
code = "UnknownCommand"
class = "usage"
statement = "The first positional argument is not exchange."

[[failure]]
code = "MissingOperand"
class = "usage"
statement = "The exchange command was given no script."

[[failure]]
code = "InputMissing"
class = "io"
statement = "The script or request path does not exist."

[[failure]]
code = "InputOpen"
class = "io"
statement = "The script or request path exists but could not be opened, for example for lack of permission or because it is a symbolic link."

[[failure]]
code = "InputType"
class = "io"
statement = "The script or request path is not a regular file."

[[failure]]
code = "InputRead"
class = "io"
statement = "Reading the script or request failed after it was opened."

[[failure]]
code = "OutputWrite"
class = "io"
statement = "Writing the response to standard output failed, for example because it was closed or full."

[[failure]]
code = "InputLimit"
class = "fault"
statement = "The request is longer than the modeled request maximum and was refused before dispatch."

[[failure]]
code = "AdapterAllocation"
class = "fault"
statement = "The adapter could not reserve the bounded input buffer."

[[failure]]
code = "ComputeFailure"
class = "fault"
statement = "The production core failed with Overflow instead of returning a step."

[[failure]]
code = "ResponseLimit"
class = "fault"
statement = "The response is longer than the modeled response maximum and was not published."

[[failure]]
code = "StepMalformed"
class = "fault"
statement = "The core returned a step that is neither a done step nor a perform step, holds an element that is not one octet, or exceeds the step bound."

[[failure]]
code = "EffectUndeclared"
class = "fault"
statement = "The entry requested an effect tag that the declaration does not contain."

[[failure]]
code = "EffectMalformed"
class = "fault"
statement = "The entry requested a declared effect with a payload that does not decode as that effect's request."

[[failure]]
code = "EffectRequestLimit"
class = "fault"
statement = "The entry requested an effect with a payload longer than the effect's modeled request maximum."

[[failure]]
code = "EffectResultLimit"
class = "fault"
statement = "An effect outcome is longer than the effect's modeled result maximum."

[[failure]]
code = "EffectBudget"
class = "fault"
statement = "The entry requested more effects in one exchange than the modeled effect budget."

[[failure]]
code = "HostFault"
class = "fault"
statement = "The host could not run a declared effect, or failed in a way the effect does not declare."

[[failure]]
code = "ScriptMalformed"
class = "fault"
statement = "The script is longer than its modeled maximum, is truncated, names an undeclared effect, or holds a request or outcome that does not decode as the effect's."

[[failure]]
code = "ScriptExhausted"
class = "fault"
statement = "The entry requested an effect after the script had no steps left."

[[failure]]
code = "ScriptMismatch"
class = "fault"
statement = "The entry requested an effect or a request payload that differs from the next scripted step."

[[failure]]
code = "ScriptUnused"
class = "fault"
statement = "The exchange finished with scripted steps that the entry never requested."
